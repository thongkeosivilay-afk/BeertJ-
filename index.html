<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Dark Profile — Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&family=Noto+Sans+Lao:wght@700;900&family=Noto+Looped+Lao:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05050f;
    --void-2:#0a0a1c;
    --center-lift:#141032;
    --panel:rgba(40,16,16,0.50);
    --panel-strong:rgba(46,18,18,0.62);
    --edge:rgba(255,80,80,0.16);
    --edge-soft:rgba(255,80,80,0.08);
    --ink:#fff3f3;
    --ink-dim:rgba(255,220,220,0.55);
    --ink-faint:rgba(255,200,200,0.30);
    --spark:#ff5c5c;
    --spark-soft:rgba(255,70,70,0.28);
    --skel:rgba(255,90,90,0.14);
    --skel-hi:rgba(255,90,90,0.24);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    background:var(--void);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  /* ================= 01 — STAGE / DARK BACKGROUND ================= */
  .stage{
    width:100%;
    max-width:460px;
    min-height:100vh;
    position:relative;
    background:
      radial-gradient(ellipse 70% 45% at 50% 30%, var(--center-lift), transparent 70%),
      linear-gradient(180deg, var(--void-2) 0%, var(--void) 55%, #050506 100%);
    overflow:hidden;
    border-radius:38px;
    padding:22px 14px 40px;
  }

  /* fine grain noise, opacity kept very low */
  .fx-noise{
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    z-index:5;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
  }

  /* cinematic vignette — section 16 */
  .fx-vignette{
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    z-index:6;
    background:
      radial-gradient(ellipse 80% 60% at 50% 38%, transparent 45%, rgba(0,0,0,0.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 12%, transparent 85%, rgba(0,0,0,0.5) 100%);
  }

  /* ================= FX — DEEP SPACE / COSMIC BACKGROUND SYSTEM ================= */
  /* Layer order: 1 core nebula glow → 2 nebula wash → 3 drifting nebula clouds →
     4 glowing star-orbs → 5 black hole → 6 starfield (3 depths) →
     7 warp-zoom streaks → 8 shooting stars/comets →
     9 existing noise → 10 existing vignette → 11 dragon */

  /* Layer 1 — Core cosmic glow */
  .fx-core-glow{
    position:absolute; left:50%; top:26%;
    width:140%; padding-bottom:90%;
    transform:translate(-50%,-50%);
    z-index:1; pointer-events:none;
    background:radial-gradient(circle, rgba(90,70,255,0.24) 0%, rgba(40,20,120,0.14) 32%, transparent 68%);
    filter:blur(6px);
    mix-blend-mode:screen;
    animation:coreBreathe 9s ease-in-out infinite;
  }
  @keyframes coreBreathe{ 0%,100%{ opacity:0.7; transform:translate(-50%,-50%) scale(1); } 50%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); } }

  /* Layer 2 — Nebula wash */
  .fx-red-gradient{
    position:absolute; inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 70% 42% at 50% 30%, rgba(90,60,220,0.18), transparent 72%),
      linear-gradient(180deg, rgba(4,4,12,0) 0%, rgba(20,10,60,0.28) 42%, rgba(2,2,8,0) 100%);
    mix-blend-mode:screen;
  }

  /* Layer 3 — Drifting nebula clouds */
  .fx-aurora{ position:absolute; inset:-25%; z-index:1; pointer-events:none; filter:blur(38px); mix-blend-mode:screen; }
  .fx-aurora i{ position:absolute; border-radius:50%; }
  .fx-aurora i:nth-child(1){
    width:70%; height:55%; left:-15%; top:0%;
    background:conic-gradient(from 90deg, rgba(90,40,220,0.30), rgba(20,0,60,0) 45%, rgba(60,140,255,0.20) 75%, rgba(20,0,60,0));
    animation:auroraSpin1 34s linear infinite;
  }
  .fx-aurora i:nth-child(2){
    width:65%; height:60%; right:-18%; bottom:-8%;
    background:conic-gradient(from 200deg, rgba(180,40,220,0.24), rgba(30,0,60,0) 40%, rgba(60,200,255,0.16) 70%, rgba(30,0,60,0));
    animation:auroraSpin2 42s linear infinite reverse;
  }
  @keyframes auroraSpin1{ 0%{ transform:rotate(0deg) scale(1); opacity:0.55; } 50%{ opacity:0.85; } 100%{ transform:rotate(360deg) scale(1.05); opacity:0.55; } }
  @keyframes auroraSpin2{ 0%{ transform:rotate(0deg) scale(1); opacity:0.45; } 50%{ opacity:0.7; } 100%{ transform:rotate(360deg) scale(1.06); opacity:0.45; } }

  /* Layer 4 — Glowing star-orbs (distant suns/planets) */
  .fx-orbs{ position:absolute; inset:0; z-index:2; pointer-events:none; mix-blend-mode:screen; }
  .fx-orbs i{ position:absolute; border-radius:50%; filter:blur(20px); }
  .fx-orbs i:nth-child(1){ width:150px;height:150px; left:6%; top:14%; background:radial-gradient(circle, rgba(140,160,255,0.5) 0%, rgba(90,60,220,0.2) 45%, transparent 75%); animation:orbFloat1 16s ease-in-out infinite, orbPulse 5s ease-in-out infinite; }
  .fx-orbs i:nth-child(2){ width:110px;height:110px; right:4%; top:28%; background:radial-gradient(circle, rgba(255,220,180,0.4) 0%, rgba(255,150,80,0.15) 45%, transparent 75%); animation:orbFloat2 19s ease-in-out infinite, orbPulse 6.5s ease-in-out infinite; }
  .fx-orbs i:nth-child(3){ width:190px;height:190px; left:-8%; top:54%; background:radial-gradient(circle, rgba(120,80,255,0.35) 0%, rgba(80,30,200,0.13) 45%, transparent 75%); animation:orbFloat3 24s ease-in-out infinite, orbPulse 7.5s ease-in-out infinite; }
  .fx-orbs i:nth-child(4){ width:120px;height:120px; right:-6%; bottom:14%; background:radial-gradient(circle, rgba(80,200,255,0.35) 0%, rgba(40,120,220,0.13) 45%, transparent 75%); animation:orbFloat1 21s ease-in-out infinite reverse, orbPulse 5.8s ease-in-out infinite; }
  @keyframes orbFloat1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(16px,-22px); } }
  @keyframes orbFloat2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-20px,18px); } }
  @keyframes orbFloat3{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(14px,16px); } }
  @keyframes orbPulse{ 0%,100%{ opacity:0.65; } 50%{ opacity:1; } }

  /* Layer 5 — Black hole with accretion disk */
  .fx-blackhole{
    position:absolute;
    left:50%; top:20%;
    width:190px; height:190px;
    transform:translate(-50%,-50%);
    z-index:2; pointer-events:none;
  }
  .fx-blackhole .disk{
    position:absolute; inset:-38%;
    border-radius:50%;
    background:conic-gradient(
      from 0deg,
      rgba(255,210,140,0.85) 0deg,
      rgba(255,120,60,0.5) 55deg,
      rgba(100,40,200,0.15) 120deg,
      transparent 180deg,
      rgba(90,60,255,0.35) 260deg,
      rgba(255,200,140,0.7) 330deg,
      rgba(255,210,140,0.85) 360deg
    );
    filter:blur(3px);
    mix-blend-mode:screen;
    animation:diskSpin 18s linear infinite;
  }
  .fx-blackhole .disk2{
    position:absolute; inset:-14%;
    border-radius:50%;
    background:conic-gradient(
      from 90deg,
      rgba(255,230,190,0.55) 0deg,
      transparent 90deg,
      rgba(120,80,255,0.4) 200deg,
      transparent 300deg,
      rgba(255,230,190,0.55) 360deg
    );
    filter:blur(1.5px);
    mix-blend-mode:screen;
    animation:diskSpin 9s linear infinite reverse;
  }
  .fx-blackhole .core{
    position:absolute; inset:8%;
    border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #100a1a 0%, #030204 60%, #000 100%);
    box-shadow:
      inset 0 0 24px 6px rgba(0,0,0,0.9),
      0 0 22px 4px rgba(120,80,255,0.25);
  }
  .fx-blackhole .lens{
    position:absolute; inset:-4%;
    border-radius:50%;
    border:1px solid rgba(200,190,255,0.18);
    filter:blur(0.5px);
    animation:lensPulse 4.5s ease-in-out infinite;
  }
  @keyframes diskSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes lensPulse{ 0%,100%{ opacity:0.5; transform:scale(1); } 50%{ opacity:0.9; transform:scale(1.05); } }

  /* Layer 6 — Starfield (three parallax depths, twinkling) */
  .fx-stars{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .fx-stars .depth{ position:absolute; inset:0; }
  .fx-stars .d-far{ animation:starTwinkle 3.6s ease-in-out infinite; }
  .fx-stars .d-mid{ animation:starTwinkle 2.4s ease-in-out infinite; animation-delay:0.4s; }
  .fx-stars .d-near{ animation:starTwinkle 1.8s ease-in-out infinite; animation-delay:0.8s; }
  .fx-stars .depth i{
    position:absolute; border-radius:50%; background:#fff;
  }
  @keyframes starTwinkle{ 0%,100%{ opacity:0.55; } 50%{ opacity:1; } }

  /* Layer 7 — Warp-zoom streaks (radiate outward from center, simulating flying through space) */
  .fx-warp{
    position:absolute; left:50%; top:38%;
    width:2px; height:2px;
    z-index:2; pointer-events:none;
  }
  .fx-warp .streak{
    position:absolute; left:0; top:0;
    width:1.5px; height:60px;
    transform-origin:0 0;
    background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(180,190,255,0.15) 55%, transparent 100%);
    animation:warpFly 3.4s linear infinite;
    opacity:0;
  }
  @keyframes warpFly{
    0%{ transform:rotate(var(--ang)) translateY(0) scaleY(0.4); opacity:0; }
    8%{ opacity:0.9; }
    75%{ opacity:0.7; }
    100%{ transform:rotate(var(--ang)) translateY(280px) scaleY(1.6); opacity:0; }
  }

  /* Layer 8 — Shooting stars / comets */
  .fx-comets{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .fx-comets .comet{
    position:absolute;
    width:100px; height:2px;
    background:linear-gradient(90deg, rgba(255,255,255,0.95), rgba(160,190,255,0.4) 55%, transparent 100%);
    border-radius:2px;
    opacity:0;
    filter:drop-shadow(0 0 4px rgba(200,210,255,0.7));
  }
  .fx-comets .c1{ top:8%;  left:-20%; transform:rotate(22deg); animation:cometFly 7s ease-in infinite; animation-delay:0.5s; }
  .fx-comets .c2{ top:36%; left:-25%; transform:rotate(16deg); animation:cometFly 9s ease-in infinite; animation-delay:3.2s; }
  .fx-comets .c3{ top:64%; left:-20%; transform:rotate(26deg); animation:cometFly 8s ease-in infinite; animation-delay:5.8s; }
  @keyframes cometFly{
    0%{ opacity:0; transform:translate(0,0) rotate(22deg) scaleX(0.6); }
    6%{ opacity:1; }
    35%{ opacity:0.9; transform:translate(230px,110px) rotate(22deg) scaleX(1.1); }
    46%{ opacity:0; transform:translate(310px,150px) rotate(22deg) scaleX(1.3); }
    100%{ opacity:0; transform:translate(310px,150px) rotate(22deg) scaleX(1.3); }
  }

  @media (max-width:480px){
    .fx-blackhole{ width:150px; height:150px; }
  }

  /* Layer 6.7 — Slithering Red Dragon (motion-path chain technique) */
  .fx-dragon{
    position:absolute; inset:0;
    z-index:4; pointer-events:none;
    overflow:hidden;
  }
  .d-seg{
    position:absolute; top:0; left:0;
    width:22px; height:16px;
    margin:-8px 0 0 -11px;
    border-radius:50% 50% 45% 45%;
    background:
      radial-gradient(ellipse at 35% 30%, rgba(255,190,120,0.9) 0%, rgba(255,70,30,0.85) 30%, rgba(160,10,10,0.85) 62%, rgba(60,0,0,0.7) 100%);
    box-shadow:0 0 10px 1px rgba(255,50,20,0.55), inset 0 0 4px rgba(0,0,0,0.4);
    offset-path: path("M -60,110 C 60,20 150,230 250,150 C 360,60 420,180 380,280 C 340,380 190,340 150,440 C 110,540 260,560 300,650 C 340,740 200,760 150,840 C 100,920 260,900 340,960");
    offset-rotate:auto;
    animation:
      dragonTravel 11s linear infinite,
      dragonFade 11s linear infinite,
      dragonPulse 1.6s ease-in-out infinite;
    animation-delay:
      calc(var(--i) * -0.14s),
      calc(var(--i) * -0.14s),
      calc(var(--i) * -0.08s);
    transform:scale(calc(1 - var(--i) * 0.045));
    filter:blur(0.2px);
  }
  @keyframes dragonTravel{ from{ offset-distance:0%; } to{ offset-distance:100%; } }
  @keyframes dragonFade{
    0%{ opacity:0; }
    4%{ opacity:0.95; }
    90%{ opacity:0.95; }
    100%{ opacity:0; }
  }
  @keyframes dragonPulse{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.25); } }

  .d-head{
    width:34px; height:26px;
    margin:-13px 0 0 -20px;
    border-radius:38% 62% 55% 55%;
    background:
      radial-gradient(ellipse at 32% 30%, rgba(255,220,160,0.98) 0%, rgba(255,90,30,0.95) 32%, rgba(190,10,10,0.95) 65%, rgba(70,0,0,0.85) 100%);
    box-shadow:0 0 16px 3px rgba(255,60,20,0.75), inset 0 0 5px rgba(0,0,0,0.45);
    z-index:2;
  }
  .d-head .horn{
    position:absolute;
    width:3px; height:14px;
    background:linear-gradient(180deg, rgba(255,200,150,0.95), rgba(120,10,10,0.9));
    border-radius:2px;
    box-shadow:0 0 6px rgba(255,80,30,0.6);
  }
  .d-head .hl{ left:6px; top:-11px; transform:rotate(-18deg); }
  .d-head .hr{ left:16px; top:-12px; transform:rotate(14deg); }
  .d-head .eye{
    position:absolute;
    width:4px; height:4px;
    left:9px; top:9px;
    border-radius:50%;
    background:#fff2c4;
    box-shadow:0 0 6px 2px rgba(255,230,140,0.95), 0 0 10px 4px rgba(255,80,20,0.5);
    animation:eyeBlink 3.2s ease-in-out infinite;
  }
  @keyframes eyeBlink{ 0%,92%,100%{ opacity:1; transform:scaleY(1); } 95%{ opacity:1; transform:scaleY(0.15); } }

  .d-fin{
    background:
      radial-gradient(ellipse at 35% 30%, rgba(255,190,120,0.9) 0%, rgba(255,70,30,0.85) 30%, rgba(160,10,10,0.85) 62%, rgba(60,0,0,0.7) 100%);
  }
  .d-fin::after{
    content:"";
    position:absolute;
    top:-9px; left:50%;
    width:0; height:0;
    transform:translateX(-50%);
    border-left:5px solid transparent;
    border-right:5px solid transparent;
    border-bottom:9px solid rgba(200,20,20,0.75);
    filter:drop-shadow(0 0 4px rgba(255,60,20,0.6));
  }
  .d-tail{
    width:9px; height:7px;
    margin:-4px 0 0 -5px;
    box-shadow:0 0 6px 1px rgba(255,50,20,0.45);
  }

  @media (max-width:480px){
    .d-seg{ filter:none; }
    .fx-dragon{ opacity:0.92; }
  }

  /* Layer 7 — Floating Particles (sharp core + soft glow) */
  .fx-particles{ position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
  .fx-particles .glow{ position:absolute; inset:0; filter:blur(4px); opacity:0.8; }
  .fx-particles .layer-a,
  .fx-particles .layer-b{ position:absolute; top:0; left:0; width:3px; height:3px; border-radius:50%; background:transparent; }
  .fx-particles .layer-a{
    background:rgba(255,255,255,0.75);
    box-shadow:
      22px 60px 0 0 rgba(255,255,255,0.6),
      70px 140px 0 0 rgba(255,255,255,0.4),
      130px 40px 0 0 rgba(255,255,255,0.55),
      190px 200px 0 0 rgba(255,255,255,0.35),
      250px 90px 0 0 rgba(255,255,255,0.5),
      310px 260px 0 0 rgba(255,255,255,0.35),
      60px 340px 0 0 rgba(255,255,255,0.4),
      160px 420px 0 0 rgba(255,255,255,0.35),
      280px 480px 0 0 rgba(255,255,255,0.5),
      40px 560px 0 0 rgba(255,255,255,0.35),
      220px 620px 0 0 rgba(255,255,255,0.4),
      350px 700px 0 0 rgba(255,255,255,0.35);
    animation:particleFloatA 20s ease-in-out infinite;
  }
  .fx-particles .layer-b{
    background:rgba(140,190,255,0.85);
    box-shadow:
      100px 100px 0 0 rgba(140,190,255,0.65),
      200px 260px 0 0 rgba(140,190,255,0.5),
      40px 320px 0 0 rgba(180,210,255,0.6),
      300px 180px 0 0 rgba(140,190,255,0.5),
      150px 480px 0 0 rgba(180,210,255,0.55),
      260px 560px 0 0 rgba(140,190,255,0.45),
      70px 640px 0 0 rgba(180,210,255,0.5),
      330px 720px 0 0 rgba(140,190,255,0.45);
    animation:particleFloatB 26s ease-in-out infinite;
  }
  @keyframes particleFloatA{ 0%,100%{ transform:translateY(0); opacity:0.75; } 50%{ transform:translateY(-16px); opacity:1; } }
  @keyframes particleFloatB{ 0%,100%{ transform:translateY(0); opacity:0.6; } 50%{ transform:translateY(-12px); opacity:0.95; } }

  @media (max-width:480px){
    .fx-core-glow{ filter:blur(4px); }
    .fx-aurora{ filter:blur(24px); }
    .fx-orbs i{ filter:blur(13px); }
    .fx-particles .layer-a{
      box-shadow:
        22px 60px 0 0 rgba(255,255,255,0.6),
        130px 40px 0 0 rgba(255,255,255,0.55),
        250px 90px 0 0 rgba(255,255,255,0.5),
        160px 420px 0 0 rgba(255,255,255,0.35),
        40px 560px 0 0 rgba(255,255,255,0.35);
    }
    .fx-particles .layer-b{
      box-shadow:
        100px 100px 0 0 rgba(140,190,255,0.65),
        40px 320px 0 0 rgba(180,210,255,0.6),
        150px 480px 0 0 rgba(180,210,255,0.55);
    }
  }

  /* ================= 02 — LARGE ROUNDED FRAME ================= */
  .frame{
    position:relative;
    isolation:isolate;
    border-radius:38px;
    background:rgba(8,8,10,0.55);
    border:1px solid var(--edge-soft);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.65),
      inset 0 0 60px -20px rgba(255,70,70,0.08);
    padding:20px 18px 26px;
    overflow:hidden;
    clip-path:inset(0 round 38px);
    animation:riseIn 0.9s cubic-bezier(.2,.8,.2,1) both;
  }
  .frame::before{ /* inner highlight — top edge only, no corner-mask trick */
    content:"";
    position:absolute;
    top:0; left:8%; right:8%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,140,140,0.22), transparent);
    pointer-events:none;
  }

  /* ================= 07 — OVERSIZED BACKGROUND TYPOGRAPHY ================= */
  .bg-type{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:min(26vw,150px);
    font-weight:900;
    letter-spacing:0.02em;
    color:rgba(255,140,140,0.05);
    white-space:nowrap;
    filter:blur(0.5px);
    z-index:1;
    pointer-events:none;
    user-select:none;
  }

  /* ================= content layer ================= */
  .content{ position:relative; z-index:7; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
    animation:fadeUp 0.7s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.05s;
  }
  .icon-btn{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    color:rgba(255,140,140,0.5);
    box-shadow:0 4px 16px -6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,140,140,0.05);
  }
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .view-pill{
    display:flex; align-items:center; gap:6px;
    padding:8px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(14px);
  }
  .view-pill .dot{width:12px;height:12px;border-radius:3px;background:rgba(255,140,140,0.25);}
  .view-pill .bar{width:22px;height:8px;border-radius:3px;background:var(--skel);}

  /* ================= 05 — MAIN VISUAL ================= */
  .visual-wrap{
    display:flex;
    justify-content:center;
    margin-top:14px;
    position:relative;
  }
  .visual-glow{
    position:absolute;
    width:220px;height:220px;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,90,90,0.20), transparent 68%);
    filter:blur(4px);
    animation:breathe 4.5s ease-in-out infinite;
    z-index:0;
  }
  .visual-placeholder{
    position:relative;
    width:150px; height:150px;
    border-radius:50%;
    background:
      radial-gradient(circle at 42% 32%, rgba(255,140,140,0.14), rgba(255,140,140,0.03) 65%),
      url('assets/store-logo.jpg');
    background-size:cover;
    background-position:center;
    border:1px solid var(--edge);
    box-shadow:
      0 0 0 1px rgba(255,140,140,0.02),
      0 20px 40px -18px rgba(0,0,0,0.7),
      inset 0 0 26px rgba(0,0,0,0.5);
    animation:floatMain 6.5s ease-in-out infinite;
    z-index:1;
    overflow:hidden;
  }

  /* ================= 08 — MAIN TITLE (static-grain + glow, no flat text) ================= */
  .title-placeholder{
    margin-top:20px;
    position:relative;
    text-align:center;
    font-family:"Anton","Arial Black","Segoe UI",sans-serif;
    font-weight:400;
    font-size:clamp(24px,7.2vw,32px);
    letter-spacing:0.05em;
    line-height:1;
    color:transparent;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.35s;
  }
  .title-placeholder .txt{
    position:relative;
    display:inline-block;
    background:
      repeating-radial-gradient(circle at 22% 30%, #fff 0 1px, transparent 1.6px 3px),
      repeating-radial-gradient(circle at 68% 62%, #fff 0 1px, transparent 1.4px 2.8px),
      linear-gradient(180deg, #fff5f5, #ffd6d6 60%, #ff8f8f);
    -webkit-background-clip:text;
    background-clip:text;
    background-size:6px 6px, 5px 5px, 100% 100%;
    animation:staticGrain 0.5s steps(4) infinite;
    filter:drop-shadow(0 0 10px rgba(255,110,110,0.55)) drop-shadow(0 0 26px rgba(255,70,70,0.35));
  }
  .title-placeholder::after{ /* pulsing glow disc behind the wordmark */
    content:"";
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:120%; height:230%;
    background:radial-gradient(ellipse at center, rgba(255,70,70,0.22), transparent 65%);
    filter:blur(6px);
    animation:glowPulse 2.8s ease-in-out infinite;
    z-index:-1;
    pointer-events:none;
  }
  @keyframes staticGrain{
    0%{background-position:0 0, 0 0, 0 0;}
    25%{background-position:2px 1px, -1px 2px, 0 0;}
    50%{background-position:-2px 2px, 1px -1px, 0 0;}
    75%{background-position:1px -2px, -2px -1px, 0 0;}
    100%{background-position:0 0, 0 0, 0 0;}
  }
  @keyframes glowPulse{
    0%,100%{opacity:0.5; transform:translate(-50%,-50%) scale(0.95);}
    50%{opacity:1; transform:translate(-50%,-50%) scale(1.06);}
  }

  /* ================= 09 — BADGE ================= */
  .badge-row{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:8px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.45s;
  }
  .badge-pill{
    display:flex; align-items:center; gap:6px;
    padding:7px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(12px);
    box-shadow:0 0 18px -8px rgba(255,90,90,0.35), inset 0 1px 0 rgba(255,140,140,0.05);
  }
  .badge-pill .ic{width:14px;height:14px;border-radius:4px;background:rgba(255,140,140,0.35);}
  .badge-pill .ic.round{border-radius:50%;}

  /* ================= 10 — INFORMATION CHIPS ================= */
  .chip-row{
    margin-top:18px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.55s;
  }
  .chip{
    display:flex; align-items:center; gap:8px;
    padding:9px 15px;
    border-radius:999px;
    background:none;
    border:none;
    box-shadow:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  .chip .ic{width:13px;height:13px;border-radius:4px;background:rgba(255,140,140,0.3);flex:0 0 auto;}
  .chip .ic svg{width:100%;height:100%;stroke:#ffb3b3;fill:none;stroke-width:2;}
  .chip .label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.06em;}
  .chip .value{font-family:'Anton',sans-serif;font-size:13px;font-weight:400;color:var(--ink);letter-spacing:0.03em;}
  .chip .bar{height:9px;border-radius:4px;background:var(--skel);}
  .chip .bar.w1{width:50px;}
  .chip .bar.w2{width:34px;}
  .chip.wide{padding:10px 20px;}
  .chip.wide .bar{width:120px;}
  .chip.wide .value{
    display:inline-block;
    max-width:130px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    vertical-align:bottom;
  }

  .chip-single{
    margin-top:10px;
    display:flex;
    justify-content:center;
  }

  /* description */
  .desc{
    margin-top:16px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.65s;
  }
  .desc .bar{height:9px;border-radius:4px;background:rgba(255,140,140,0.06);}
  .desc .bar:nth-child(1){width:60%;}
  .desc .bar:nth-child(2){width:42%;}

  /* notice text (no frame) */
  .notice{
    margin-top:22px;
    padding:0 6px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.75s;
  }
  .notice .txt{
    font-family:'Noto Looped Lao','Noto Sans Lao','Poppins',-apple-system,sans-serif;
    font-weight:900;
    font-size:18px;
    letter-spacing:0.02em;
    background:linear-gradient(180deg,#fff5f5 0%,#ffb3b3 45%,#ff5c5c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 10px rgba(255,90,90,0.65), 0 0 26px rgba(255,60,60,0.5);
    animation:noticeGlow 2.8s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes noticeGlow{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.25); }
  }

  /* ================= 11/12 — SOCIAL CARD ================= */
  .social-card{
    margin-top:18px;
    position:relative;
    isolation:isolate;
    border-radius:30px;
    background:var(--panel);
    border:1px solid var(--edge);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:20px;
    display:flex; align-items:center; gap:20px;
    min-height:120px;
    box-shadow:
      0 20px 40px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,140,140,0.05);
    overflow:hidden;
    animation:fadeUp 0.85s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.85s;
  }
  .social-card.card-2{ margin-top:14px; animation-delay:0.95s; }
  .social-card.card-3{ margin-top:14px; animation-delay:1.05s; }
  .social-card::before{ /* section 12 texture: gradient darker on one side */
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background:linear-gradient(115deg, rgba(0,0,0,0.35) 0%, transparent 45%, rgba(255,140,140,0.03) 100%);
    pointer-events:none;
    z-index:0;
  }
  .social-card::after{ /* soft blurred shape, kept inside bounds so it can't leak past the radius */
    content:"";
    position:absolute;
    top:0; right:0; bottom:0; left:0;
    border-radius:inherit;
    background:radial-gradient(circle at 88% -10%, var(--spark-soft), transparent 55%);
    pointer-events:none;
    z-index:0;
  }
  .social-avatar{
    position:relative;
    width:88px; height:88px;
    border-radius:22px;
    background:radial-gradient(circle at 38% 28%, rgba(255,140,140,0.16), rgba(255,140,140,0.03) 75%);
    border:1px solid var(--edge);
    flex:0 0 auto;
    box-shadow:0 0 30px -8px rgba(255,90,90,0.4);
    z-index:1;
  }
  .social-info{ flex:1; display:flex; flex-direction:column; gap:11px; position:relative; z-index:1; }
  .social-info .bar{height:14px;border-radius:6px;background:var(--skel);}
  .social-info .bar.title{width:68%;height:20px;background:var(--skel-hi);}
  .social-info .bar.sub{width:38%;}
  .social-info .bar.tag{width:52%;}

  .social-card{ text-decoration:none; cursor:pointer; transition:transform 0.2s ease, box-shadow 0.2s ease; }
  .social-card:active{ transform:scale(0.98); }
  .card-bg-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:0;
    pointer-events:none;
  }
  .card-bg-overlay{
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(10,3,3,0.78) 0%, rgba(10,3,3,0.45) 55%, rgba(10,3,3,0.75) 100%);
    z-index:0;
    pointer-events:none;
  }
  .social-avatar-icon{ display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, rgba(255,60,60,0.35), rgba(120,10,10,0.55)); }
  .label-text{
    height:auto; background:none; border-radius:0;
    color:#ffffff; font-weight:700; font-size:15px; line-height:1.3; text-align:left;
  }
  .label-text.small{ font-weight:500; font-size:12px; color:rgba(255,255,255,0.6); }

  /* Kill the skeleton pill background once real text fills the bar (wins the specificity tie by source order) */
  .social-info .bar.label-text{ background:none; }

  .social-info .bar.title.label-text{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:19px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:#ffffff;
  }
  .social-info .bar.sub.label-text,
  .social-info .bar.tag.label-text{
    font-family:'Poppins',-apple-system,sans-serif;
    letter-spacing:0.015em;
  }
  .social-info .bar.sub.label-text{
    display:block;
    max-width:100%;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .social-info .bar.tag.label-text{
    color:#ffffff;
    font-weight:500;
  }

  /* ================= keyframes ================= */
  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes floatMain{
    0%{transform:translateY(0) scale(1) rotate(0deg);}
    30%{transform:translateY(-6px) scale(1.015) rotate(0.6deg);}
    55%{transform:translateY(2px) scale(1.005) rotate(-0.4deg);}
    80%{transform:translateY(-3px) scale(1.01) rotate(0.3deg);}
    100%{transform:translateY(0) scale(1) rotate(0deg);}
  }
  @keyframes breathe{
    0%,100%{opacity:0.55; transform:translate(-50%,-50%) scale(0.94);}
    50%{opacity:0.9; transform:translate(-50%,-50%) scale(1.06);}
  }

  .home-bar{
    position:absolute;
    bottom:10px; left:50%;
    transform:translateX(-50%);
    width:120px; height:4px;
    border-radius:2px;
    background:rgba(255,140,140,0.18);
    z-index:8;
  }

  /* ================= floating music toggle button ================= */
  .music-toggle{
    position:fixed;
    left:18px; top:18px;
    width:46px; height:46px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(20,8,8,0.65);
    border:1px solid var(--edge);
    backdrop-filter:blur(10px);
    box-shadow:0 4px 18px -4px rgba(0,0,0,0.5);
    cursor:pointer;
    z-index:50;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  .music-toggle:active{ transform:scale(0.92); }
  .music-toggle svg{
    width:20px; height:20px;
    stroke:#ffffff;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .music-toggle .icon-off{ display:none; }
  .music-toggle.is-muted .icon-on{ display:none; }
  .music-toggle.is-muted .icon-off{ display:block; }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>

  <script>
    document.querySelectorAll('.card-bg-video').forEach(function(v){
      v.muted = true;
      v.defaultMuted = true;
      var tryPlay = function(){ v.play().catch(function(){}); };
      tryPlay();
      document.addEventListener('touchstart', tryPlay, { once:true, passive:true });
      document.addEventListener('click', tryPlay, { once:true });
    });

    // Background music + floating toggle button
    var bgMusic = document.getElementById('bg-music');
    var toggleBtn = document.getElementById('music-toggle');
    if (bgMusic && toggleBtn) {
      bgMusic.volume = 0.6;
      var userPaused = false;

      var setMutedUI = function(isMuted){
        toggleBtn.classList.toggle('is-muted', isMuted);
      };

      var startMusic = function(){
        if (userPaused) return;
        bgMusic.play().then(function(){ setMutedUI(false); }).catch(function(){});
      };

      // Try immediately in case autoplay is allowed
      startMusic();
      // Fallback: start on first tap/click/scroll anywhere (mobile autoplay policies)
      window.addEventListener('touchstart', startMusic, { once:true, passive:true });
      window.addEventListener('click', startMusic, { once:true });
      window.addEventListener('scroll', startMusic, { once:true, passive:true });

      toggleBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if (bgMusic.paused) {
          userPaused = false;
          bgMusic.play().then(function(){ setMutedUI(false); }).catch(function(){});
        } else {
          userPaused = true;
          bgMusic.pause();
          setMutedUI(true);
        }
      });

      // Reflect actual state if it changes for any other reason
      bgMusic.addEventListener('pause', function(){ setMutedUI(true); });
      bgMusic.addEventListener('play', function(){ setMutedUI(false); });

      // Start muted-looking until we know playback actually began
      setMutedUI(true);
    }
  </script>

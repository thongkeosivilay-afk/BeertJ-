<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Dark Profile — Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&family=Noto+Sans+Lao:wght@700;900&family=Noto+Looped+Lao:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05050f;
    --void-2:#0a0a1c;
    --center-lift:#141032;
    --panel:rgba(40,16,16,0.50);
    --panel-strong:rgba(46,18,18,0.62);
    --edge:rgba(255,80,80,0.16);
    --edge-soft:rgba(255,80,80,0.08);
    --ink:#fff3f3;
    --ink-dim:rgba(255,220,220,0.55);
    --ink-faint:rgba(255,200,200,0.30);
    --spark:#ff5c5c;
    --spark-soft:rgba(255,70,70,0.28);
    --skel:rgba(255,90,90,0.14);
    --skel-hi:rgba(255,90,90,0.24);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    background:var(--void);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  /* ================= 01 — STAGE / DARK BACKGROUND ================= */
  .stage{
    width:100%;
    max-width:460px;
    min-height:100vh;
    position:relative;
    background: var(--void);
    overflow:hidden;
    border-radius:38px;
    padding:22px 14px 40px;
  }


  .lightning-gl{
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index:0;
    display:block;
    pointer-events:none;
  }
  .lightning-flash{
    position:absolute; inset:0;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(ellipse 70% 60% at 50% 42%, rgba(255,235,225,0.85), rgba(255,90,70,0.35) 42%, transparent 78%);
    opacity:0;
  }

  /* ================= 02 — LARGE ROUNDED FRAME ================= */
  .frame{
    position:relative;
    z-index:1;
    isolation:isolate;
    border-radius:38px;
    background:rgba(8,8,10,0.55);
    border:1px solid var(--edge-soft);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.65),
      inset 0 0 60px -20px rgba(255,70,70,0.08);
    padding:20px 18px 26px;
    overflow:hidden;
    clip-path:inset(0 round 38px);
    animation:riseIn 0.9s cubic-bezier(.2,.8,.2,1) both;
  }
  .frame::before{ /* inner highlight — top edge only, no corner-mask trick */
    content:"";
    position:absolute;
    top:0; left:8%; right:8%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,140,140,0.22), transparent);
    pointer-events:none;
  }

  /* ================= 07 — OVERSIZED BACKGROUND TYPOGRAPHY ================= */
  .bg-type{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:min(26vw,150px);
    font-weight:900;
    letter-spacing:0.02em;
    color:rgba(255,140,140,0.05);
    white-space:nowrap;
    filter:blur(0.5px);
    z-index:1;
    pointer-events:none;
    user-select:none;
  }

  /* ================= content layer ================= */
  .content{ position:relative; z-index:7; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
    animation:fadeUp 0.7s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.05s;
  }
  .icon-btn{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    color:rgba(255,140,140,0.5);
    box-shadow:0 4px 16px -6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,140,140,0.05);
  }
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .view-pill{
    display:flex; align-items:center; gap:6px;
    padding:8px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(14px);
  }
  .view-pill .dot{width:12px;height:12px;border-radius:3px;background:rgba(255,140,140,0.25);}
  .view-pill .bar{width:22px;height:8px;border-radius:3px;background:var(--skel);}

  /* ================= 05 — MAIN VISUAL ================= */
  .visual-wrap{
    display:flex;
    justify-content:center;
    margin-top:14px;
    position:relative;
  }
  .visual-glow{
    position:absolute;
    width:220px;height:220px;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,90,90,0.20), transparent 68%);
    filter:blur(4px);
    animation:breathe 4.5s ease-in-out infinite;
    z-index:0;
  }
  .visual-placeholder{
    position:relative;
    width:150px; height:150px;
    border-radius:50%;
    background:
      radial-gradient(circle at 42% 32%, rgba(255,140,140,0.14), rgba(255,140,140,0.03) 65%),
      url('assets/store-logo.jpg');
    background-size:cover;
    background-position:center;
    border:1px solid var(--edge);
    box-shadow:
      0 0 0 1px rgba(255,140,140,0.02),
      0 20px 40px -18px rgba(0,0,0,0.7),
      inset 0 0 26px rgba(0,0,0,0.5);
    animation:floatMain 6.5s ease-in-out infinite;
    z-index:1;
    overflow:hidden;
  }

  /* ================= 08 — MAIN TITLE (static-grain + glow, no flat text) ================= */
  .title-placeholder{
    margin-top:20px;
    position:relative;
    text-align:center;
    font-family:"Anton","Arial Black","Segoe UI",sans-serif;
    font-weight:400;
    font-size:clamp(24px,7.2vw,32px);
    letter-spacing:0.05em;
    line-height:1;
    color:transparent;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.35s;
  }
  .title-placeholder .txt{
    position:relative;
    display:inline-block;
    background:
      repeating-radial-gradient(circle at 22% 30%, #fff 0 1px, transparent 1.6px 3px),
      repeating-radial-gradient(circle at 68% 62%, #fff 0 1px, transparent 1.4px 2.8px),
      linear-gradient(180deg, #fff5f5, #ffd6d6 60%, #ff8f8f);
    -webkit-background-clip:text;
    background-clip:text;
    background-size:6px 6px, 5px 5px, 100% 100%;
    animation:staticGrain 0.5s steps(4) infinite;
    filter:drop-shadow(0 0 10px rgba(255,110,110,0.55)) drop-shadow(0 0 26px rgba(255,70,70,0.35));
  }
  .title-placeholder::after{ /* pulsing glow disc behind the wordmark */
    content:"";
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:120%; height:230%;
    background:radial-gradient(ellipse at center, rgba(255,70,70,0.22), transparent 65%);
    filter:blur(6px);
    animation:glowPulse 2.8s ease-in-out infinite;
    z-index:-1;
    pointer-events:none;
  }
  @keyframes staticGrain{
    0%{background-position:0 0, 0 0, 0 0;}
    25%{background-position:2px 1px, -1px 2px, 0 0;}
    50%{background-position:-2px 2px, 1px -1px, 0 0;}
    75%{background-position:1px -2px, -2px -1px, 0 0;}
    100%{background-position:0 0, 0 0, 0 0;}
  }
  @keyframes glowPulse{
    0%,100%{opacity:0.5; transform:translate(-50%,-50%) scale(0.95);}
    50%{opacity:1; transform:translate(-50%,-50%) scale(1.06);}
  }

  /* ================= 09 — BADGE ================= */
  .badge-row{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:8px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.45s;
  }
  .badge-pill{
    display:flex; align-items:center; gap:6px;
    padding:7px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(12px);
    box-shadow:0 0 18px -8px rgba(255,90,90,0.35), inset 0 1px 0 rgba(255,140,140,0.05);
  }
  .badge-pill .ic{width:14px;height:14px;border-radius:4px;background:rgba(255,140,140,0.35);}
  .badge-pill .ic.round{border-radius:50%;}

  /* ================= 10 — INFORMATION CHIPS ================= */
  .chip-row{
    margin-top:18px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.55s;
  }
  .chip{
    display:flex; align-items:center; gap:8px;
    padding:9px 15px;
    border-radius:999px;
    background:none;
    border:none;
    box-shadow:none;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  .chip .ic{width:13px;height:13px;border-radius:4px;background:rgba(255,140,140,0.3);flex:0 0 auto;}
  .chip .ic svg{width:100%;height:100%;stroke:#ffb3b3;fill:none;stroke-width:2;}
  .chip .label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.06em;}
  .chip .value{font-family:'Anton',sans-serif;font-size:13px;font-weight:400;color:var(--ink);letter-spacing:0.03em;}
  .chip .bar{height:9px;border-radius:4px;background:var(--skel);}
  .chip .bar.w1{width:50px;}
  .chip .bar.w2{width:34px;}
  .chip.wide{padding:10px 20px;}
  .chip.wide .bar{width:120px;}
  .chip.wide .value{
    display:inline-block;
    max-width:130px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    vertical-align:bottom;
  }

  .chip-single{
    margin-top:10px;
    display:flex;
    justify-content:center;
  }

  /* description */
  .desc{
    margin-top:16px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.65s;
  }
  .desc .bar{height:9px;border-radius:4px;background:rgba(255,140,140,0.06);}
  .desc .bar:nth-child(1){width:60%;}
  .desc .bar:nth-child(2){width:42%;}

  /* notice text (no frame) */
  .notice{
    margin-top:22px;
    padding:0 6px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.75s;
  }
  .notice .txt{
    font-family:'Noto Looped Lao','Noto Sans Lao','Poppins',-apple-system,sans-serif;
    font-weight:900;
    font-size:18px;
    letter-spacing:0.02em;
    background:linear-gradient(180deg,#fff5f5 0%,#ffb3b3 45%,#ff5c5c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 10px rgba(255,90,90,0.65), 0 0 26px rgba(255,60,60,0.5);
    animation:noticeGlow 2.8s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes noticeGlow{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.25); }
  }

  /* ================= 11/12 — SOCIAL CARD ================= */
  .social-card{
    margin-top:18px;
    position:relative;
    isolation:isolate;
    border-radius:30px;
    background:var(--panel);
    border:1px solid var(--edge);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:20px;
    display:flex; align-items:center; gap:20px;
    min-height:120px;
    box-shadow:
      0 20px 40px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,140,140,0.05);
    overflow:hidden;
    animation:fadeUp 0.85s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.85s;
  }
  .social-card.card-2{ margin-top:14px; animation-delay:0.95s; }
  .social-card.card-3{ margin-top:14px; animation-delay:1.05s; }
  .social-card::before{ /* section 12 texture: gradient darker on one side */
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background:linear-gradient(115deg, rgba(0,0,0,0.35) 0%, transparent 45%, rgba(255,140,140,0.03) 100%);
    pointer-events:none;
    z-index:0;
  }
  .social-card::after{ /* soft blurred shape, kept inside bounds so it can't leak past the radius */
    content:"";
    position:absolute;
    top:0; right:0; bottom:0; left:0;
    border-radius:inherit;
    background:radial-gradient(circle at 88% -10%, var(--spark-soft), transparent 55%);
    pointer-events:none;
    z-index:0;
  }
  .social-avatar{
    position:relative;
    width:88px; height:88px;
    border-radius:22px;
    background:radial-gradient(circle at 38% 28%, rgba(255,140,140,0.16), rgba(255,140,140,0.03) 75%);
    border:1px solid var(--edge);
    flex:0 0 auto;
    box-shadow:0 0 30px -8px rgba(255,90,90,0.4);
    z-index:1;
  }
  .social-info{ flex:1; display:flex; flex-direction:column; gap:11px; position:relative; z-index:1; }
  .social-info .bar{height:14px;border-radius:6px;background:var(--skel);}
  .social-info .bar.title{width:68%;height:20px;background:var(--skel-hi);}
  .social-info .bar.sub{width:38%;}
  .social-info .bar.tag{width:52%;}

  .social-card{ text-decoration:none; cursor:pointer; transition:transform 0.2s ease, box-shadow 0.2s ease; }
  .social-card:active{ transform:scale(0.98); }
  .card-bg-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:0;
    pointer-events:none;
  }
  .card-bg-overlay{
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(10,3,3,0.78) 0%, rgba(10,3,3,0.45) 55%, rgba(10,3,3,0.75) 100%);
    z-index:0;
    pointer-events:none;
  }
  .social-avatar-icon{ display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, rgba(255,60,60,0.35), rgba(120,10,10,0.55)); }
  .label-text{
    height:auto; background:none; border-radius:0;
    color:#ffffff; font-weight:700; font-size:15px; line-height:1.3; text-align:left;
  }
  .label-text.small{ font-weight:500; font-size:12px; color:rgba(255,255,255,0.6); }

  /* Kill the skeleton pill background once real text fills the bar (wins the specificity tie by source order) */
  .social-info .bar.label-text{ background:none; }

  .social-info .bar.title.label-text{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:19px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:#ffffff;
  }
  .social-info .bar.sub.label-text,
  .social-info .bar.tag.label-text{
    font-family:'Poppins',-apple-system,sans-serif;
    letter-spacing:0.015em;
  }
  .social-info .bar.sub.label-text{
    display:block;
    max-width:100%;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .social-info .bar.tag.label-text{
    color:#ffffff;
    font-weight:500;
  }

  /* ================= keyframes ================= */
  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes floatMain{
    0%{transform:translateY(0) scale(1) rotate(0deg);}
    30%{transform:translateY(-6px) scale(1.015) rotate(0.6deg);}
    55%{transform:translateY(2px) scale(1.005) rotate(-0.4deg);}
    80%{transform:translateY(-3px) scale(1.01) rotate(0.3deg);}
    100%{transform:translateY(0) scale(1) rotate(0deg);}
  }
  @keyframes breathe{
    0%,100%{opacity:0.55; transform:translate(-50%,-50%) scale(0.94);}
    50%{opacity:0.9; transform:translate(-50%,-50%) scale(1.06);}
  }

  .home-bar{
    position:absolute;
    bottom:10px; left:50%;
    transform:translateX(-50%);
    width:120px; height:4px;
    border-radius:2px;
    background:rgba(255,140,140,0.18);
    z-index:8;
  }

  /* ================= floating music toggle button ================= */
  .music-toggle{
    position:fixed;
    left:18px; top:18px;
    width:46px; height:46px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(20,8,8,0.65);
    border:1px solid var(--edge);
    backdrop-filter:blur(10px);
    box-shadow:0 4px 18px -4px rgba(0,0,0,0.5);
    cursor:pointer;
    z-index:50;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  .music-toggle:active{ transform:scale(0.92); }
  .music-toggle svg{
    width:20px; height:20px;
    stroke:#ffffff;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .music-toggle .icon-off{ display:none; }
  .music-toggle.is-muted .icon-on{ display:none; }
  .music-toggle.is-muted .icon-off{ display:block; }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>
  <div class="stage">

    <canvas id="lightning-gl" class="lightning-gl"></canvas>
    <div id="lightning-flash" class="lightning-flash"></div>

    <audio id="bg-music" src="assets/bg-music.mp3" loop preload="auto"></audio>

    <button id="music-toggle" class="music-toggle" type="button" aria-label="Toggle music">
      <svg class="icon-on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="icon-off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 5 6"/><path d="m22 9-5 6"/></svg>
    </button>


    <div class="frame">


      <div class="content">

        <div class="visual-wrap">
          <div class="visual-glow"></div>
          <div class="visual-placeholder"></div>
        </div>

        <div class="title-placeholder"><span class="txt">DEKMASHSHOP</span></div>

        <div class="chip-row">
          <div class="chip"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg></div><span class="label">Owner</span><span class="value">DEKMASHSHOP</span></div>
        </div>
        <div class="chip-single">
          <div class="chip wide"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 5.5 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.5-4-9s1.5-6.5 4-9Z"/></svg></div><span class="label">Website</span><span class="value">dekmashshop.tfgdhggg.workers.dev</span></div>
        </div>

        <div class="desc"></div>

        <div class="notice">
          <span class="txt">ຮ້ານຂາຍໂປອັນດັບ 1 ໃນລາວ</span>
        </div>

        <a class="social-card" href="https://dekmashshop.tfgdhggg.workers.dev/#categories" target="_blank" rel="noopener">
          <video class="card-bg-video" src="assets/card-bg-1.mp4" autoplay loop muted playsinline webkit-playsinline preload="auto"></video>
          <div class="card-bg-overlay"></div>
          <div class="social-avatar" style="background-image:url('assets/store-logo.jpg');background-size:cover;background-position:center;"></div>
          <div class="social-info">
            <div class="bar title label-text">Categories</div>
            <div class="bar sub label-text small">dekmashshop.tfgdhggg.workers.dev</div>
            <div class="bar tag label-text small">Shop Now</div>
          </div>
        </a>

        <a class="social-card card-2" href="https://vt.tiktok.com/ZSVYe42Lv/" target="_blank" rel="noopener">
          <video class="card-bg-video" src="assets/card-bg-2.mp4" autoplay loop muted playsinline webkit-playsinline preload="auto"></video>
          <div class="card-bg-overlay"></div>
          <div class="social-avatar" style="background-image:url('assets/tiktok-icon.jpeg');background-size:cover;background-position:center;"></div>
          <div class="social-info">
            <div class="bar title label-text">TikTok</div>
            <div class="bar sub label-text small">@dekmashshop</div>
            <div class="bar tag label-text small">Watch Now</div>
          </div>
        </a>

        <a class="social-card card-3" href="https://discord.gg/CM9V9UZJD" target="_blank" rel="noopener">
          <video class="card-bg-video" src="assets/card-bg-3.mp4" autoplay loop muted playsinline webkit-playsinline preload="auto"></video>
          <div class="card-bg-overlay"></div>
          <div class="social-avatar" style="background-image:url('assets/discord-icon.jpeg');background-size:cover;background-position:center;"></div>
          <div class="social-info">
            <div class="bar title label-text">Discord</div>
            <div class="bar sub label-text small">Join our server</div>
            <div class="bar tag label-text small">Join Now</div>
          </div>
        </a>
      </div>

      <div class="home-bar"></div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.card-bg-video').forEach(function(v){
      v.muted = true;
      v.defaultMuted = true;
      var tryPlay = function(){ v.play().catch(function(){}); };
      tryPlay();
      document.addEventListener('touchstart', tryPlay, { once:true, passive:true });
      document.addEventListener('click', tryPlay, { once:true });
    });

    // Background music + floating toggle button
    var bgMusic = document.getElementById('bg-music');
    var toggleBtn = document.getElementById('music-toggle');
    if (bgMusic && toggleBtn) {
      bgMusic.volume = 0.6;
      var userPaused = false;

      var setMutedUI = function(isMuted){
        toggleBtn.classList.toggle('is-muted', isMuted);
      };

      var startMusic = function(){
        if (userPaused) return;
        bgMusic.play().then(function(){ setMutedUI(false); }).catch(function(){});
      };

      // Try immediately in case autoplay is allowed
      startMusic();
      // Fallback: start on first tap/click/scroll anywhere (mobile autoplay policies)
      window.addEventListener('touchstart', startMusic, { once:true, passive:true });
      window.addEventListener('click', startMusic, { once:true });
      window.addEventListener('scroll', startMusic, { once:true, passive:true });

      toggleBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if (bgMusic.paused) {
          userPaused = false;
          bgMusic.play().then(function(){ setMutedUI(false); }).catch(function(){});
        } else {
          userPaused = true;
          bgMusic.pause();
          setMutedUI(true);
        }
      });

      // Reflect actual state if it changes for any other reason
      bgMusic.addEventListener('pause', function(){ setMutedUI(true); });
      bgMusic.addEventListener('play', function(){ setMutedUI(false); });

      // Start muted-looking until we know playback actually began
      setMutedUI(true);
    }
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    // ===== Lightning strike background effect (red) — cooldown 4s =====
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stageEl = document.querySelector('.stage');
    const canvas = document.getElementById('lightning-gl');

    function stageSize(){
      const r = stageEl.getBoundingClientRect();
      return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
    }

    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0304, 0.05);

    let { w: sw, h: sh } = stageSize();
    const camera = new THREE.PerspectiveCamera(50, sw/sh, 0.1, 100);
    camera.position.set(0, 0.5, 9);
    camera.lookAt(0, 0.5, 0);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(sw, sh), 1.7, 0.65, 0.12);
    composer.addPass(bloomPass);

    scene.add(new THREE.AmbientLight(0x120608, 0.15));

    function softDot(size, inner, outer){
      const c = document.createElement('canvas'); c.width=c.height=size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
      g.addColorStop(0, inner); g.addColorStop(1, outer);
      ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
      return new THREE.CanvasTexture(c);
    }
    const hazeTex = softDot(256, 'rgba(255,225,215,0.9)', 'rgba(255,60,45,0)');

    function displaceBolt3D(start, end, iterations, displace){
      let pts = [start.clone(), end.clone()];
      for(let it=0; it<iterations; it++){
        const next = [];
        for(let i=0;i<pts.length-1;i++){
          const a=pts[i], b=pts[i+1];
          const mid = a.clone().add(b).multiplyScalar(0.5);
          const dir = b.clone().sub(a).normalize();
          let perp = new THREE.Vector3(1,0,0).cross(dir);
          if(perp.lengthSq()<0.01) perp = new THREE.Vector3(0,1,0).cross(dir);
          perp.normalize();
          const perp2 = dir.clone().cross(perp).normalize();
          const off = (Math.random()*2-1)*displace;
          const off2 = (Math.random()*2-1)*displace*0.55;
          mid.add(perp.multiplyScalar(off)).add(perp2.multiplyScalar(off2));
          next.push(a, mid);
        }
        next.push(pts[pts.length-1]);
        pts = next; displace *= 0.6;
      }
      return pts;
    }

    function tubeFromPoints(pts, radius, radialSeg){
      const curve = new THREE.CatmullRomCurve3(pts);
      return new THREE.TubeGeometry(curve, Math.max(12, pts.length), radius, radialSeg, false);
    }

    function buildLightning(){
      const group = new THREE.Group();
      const meshes = [];

      const top = new THREE.Vector3((Math.random()-0.5)*1.2, 7.5, (Math.random()-0.5)*1.5);
      const bottom = new THREE.Vector3((Math.random()-0.5)*1.5, -6.5, (Math.random()-0.5)*1.5);
      const trunkPts = displaceBolt3D(top, bottom, 6, 1.1);

      const segCount = 3;
      const perSeg = Math.floor(trunkPts.length/segCount);
      const radii = [0.055, 0.04, 0.025];
      const glowRadii = [0.16, 0.12, 0.08];
      for(let s=0; s<segCount; s++){
        const startIdx = Math.max(0, s*perSeg - 1);
        const endIdx = (s===segCount-1)? trunkPts.length-1 : (s+1)*perSeg;
        const slice = trunkPts.slice(startIdx, endIdx+1);
        if(slice.length < 2) continue;
        const glowGeo = tubeFromPoints(slice, glowRadii[s], 6);
        const glowMat = new THREE.MeshBasicMaterial({ color:0xff3b2c, transparent:true, opacity:0.42, blending:THREE.AdditiveBlending, depthWrite:false });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        group.add(glowMesh); meshes.push({mesh:glowMesh, base:0.42});

        const coreGeo = tubeFromPoints(slice, radii[s], 6);
        const coreMat = new THREE.MeshBasicMaterial({ color:0xfff2e6, transparent:true, opacity:1, blending:THREE.AdditiveBlending, depthWrite:false });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        group.add(coreMesh); meshes.push({mesh:coreMesh, base:1});
      }

      const trunkCurve = new THREE.CatmullRomCurve3(trunkPts);

      const secondaryCount = 7 + Math.floor(Math.random()*5);
      for(let i=0;i<secondaryCount;i++){
        const t = 0.08 + Math.random()*0.75;
        const bStart = trunkCurve.getPoint(t);
        const dir = trunkCurve.getTangent(t).clone();
        let perp = new THREE.Vector3(1,0,0).cross(dir);
        if(perp.lengthSq()<0.01) perp = new THREE.Vector3(0,1,0).cross(dir);
        perp.normalize();
        const ang = Math.random()*Math.PI*2;
        const spread = perp.clone().applyAxisAngle(dir, ang);
        const len = 1.0+Math.random()*2.2;
        const bEnd = bStart.clone().add(dir.clone().multiplyScalar(len*0.55)).add(spread.multiplyScalar(len*0.85));
        const bPts = displaceBolt3D(bStart, bEnd, 3, 0.5);

        const glowGeo = tubeFromPoints(bPts, 0.05, 5);
        const glowMat = new THREE.MeshBasicMaterial({ color:0xff5a45, transparent:true, opacity:0.34, blending:THREE.AdditiveBlending, depthWrite:false });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        group.add(glowMesh); meshes.push({mesh:glowMesh, base:0.34});

        const coreGeo = tubeFromPoints(bPts, 0.015, 5);
        const coreMat = new THREE.MeshBasicMaterial({ color:0xffe8de, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        group.add(coreMesh); meshes.push({mesh:coreMesh, base:0.85});

        const tertCount = Math.floor(Math.random()*3);
        const bCurve = new THREE.CatmullRomCurve3(bPts);
        for(let j=0;j<tertCount;j++){
          const tt = 0.3+Math.random()*0.5;
          const tStart = bCurve.getPoint(tt);
          const tDir = bCurve.getTangent(tt).clone();
          let tPerp = new THREE.Vector3(0,1,0).cross(tDir);
          if(tPerp.lengthSq()<0.01) tPerp = new THREE.Vector3(1,0,0).cross(tDir);
          tPerp.normalize().applyAxisAngle(tDir, Math.random()*Math.PI*2);
          const tLen = 0.4+Math.random()*0.8;
          const tEnd = tStart.clone().add(tDir.clone().multiplyScalar(tLen*0.4)).add(tPerp.multiplyScalar(tLen*0.9));
          const tPts = displaceBolt3D(tStart, tEnd, 2, 0.22);
          const tGeo = tubeFromPoints(tPts, 0.008, 4);
          const tMat = new THREE.MeshBasicMaterial({ color:0xffd9cc, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending, depthWrite:false });
          const tMesh = new THREE.Mesh(tGeo, tMat);
          group.add(tMesh); meshes.push({mesh:tMesh, base:0.4});
        }
      }

      return { group, meshes };
    }

    const hazeSprites = [];
    const hazeGroup = new THREE.Group();
    scene.add(hazeGroup);
    for(let i=0;i<7;i++){
      const mat = new THREE.SpriteMaterial({ map:hazeTex, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending });
      const s = new THREE.Sprite(mat);
      const scale = 2.5+Math.random()*3;
      s.scale.set(scale, scale, 1);
      hazeGroup.add(s);
      hazeSprites.push(s);
    }

    const NUM_LIGHTS = 4;
    const lights = [];
    for(let i=0;i<NUM_LIGHTS;i++){
      const l = new THREE.PointLight(0xff8a6a, 0, 14, 2);
      scene.add(l);
      lights.push(l);
    }

    const ENVELOPE = [
      {t:0,   v:0.0}, {t:8, v:0.12}, {t:18, v:0.08}, {t:30, v:1.0},
      {t:45,  v:0.55}, {t:60, v:0.9}, {t:80, v:0.35}, {t:100, v:0.7},
      {t:130, v:0.3}, {t:180, v:0.16}, {t:260, v:0.08}, {t:400, v:0.02}, {t:550, v:0.0}
    ];
    const STRIKE_DURATION = 550;
    const COOLDOWN = 4000;

    function envelopeAt(t){
      if(t<=0 || t>=STRIKE_DURATION) return 0;
      for(let i=0;i<ENVELOPE.length-1;i++){
        if(t>=ENVELOPE[i].t && t<=ENVELOPE[i+1].t){
          const a=ENVELOPE[i], b=ENVELOPE[i+1];
          const f = (t-a.t)/(b.t-a.t||1);
          return a.v + (b.v-a.v)*f;
        }
      }
      return 0;
    }

    let current = null;
    let cycleStart = performance.now() + 400;

    function triggerStrike(){
      if(current){ scene.remove(current.group); current = null; }
      const built = buildLightning();
      scene.add(built.group);
      current = { ...built, born: performance.now() };

      hazeSprites.forEach((s,i)=>{
        s.position.set((Math.random()-0.5)*2.5, 6 - i*1.7 + (Math.random()-0.5), (Math.random()-0.5)*1.5);
      });
      lights.forEach((l,i)=>{
        l.position.set((Math.random()-0.5)*1.5, 6 - i*4, (Math.random()-0.5)*1.5);
      });
    }

    const flashEl = document.getElementById('lightning-flash');

    const clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now();
      clock.getDelta();

      if(now - cycleStart >= COOLDOWN){
        cycleStart = now;
        triggerStrike();
      }

      let intensity = 0;
      if(current){
        const t = now - current.born;
        intensity = envelopeAt(t);
        if(t > STRIKE_DURATION){
          scene.remove(current.group);
          current = null;
        }
      }

      if(current){
        if(intensity > 0.02 && !reduced){
          current.group.position.set((Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, 0);
        }
        current.meshes.forEach(m=>{
          const flicker = 0.85 + Math.random()*0.3;
          m.mesh.material.opacity = Math.min(1, m.base * intensity * flicker);
        });
      }

      lights.forEach(l=>{ l.intensity = intensity * 9; });
      hazeSprites.forEach(s=>{ s.material.opacity = intensity * 0.35; });
      flashEl.style.opacity = String(Math.min(0.75, intensity * 0.75));
      bloomPass.strength = 1.2 + intensity*1.1;

      composer.render();
    }

    function onResize(){
      const { w, h } = stageSize();
      camera.aspect = w/h; camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    onResize();

    animate();
  </script>

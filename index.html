<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEKMASHSHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Anton&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;700;900&family=Noto+Looped+Lao:wght@400;500;700;800;900&family=Russo+One&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#080001;
    --void-2:#120002;
    --center-lift:#240003;
    --panel:rgba(38,0,4,0.50);
    --panel-strong:rgba(44,0,4,0.62);
    --edge:rgba(255,0,24,0.16);
    --edge-soft:rgba(255,0,24,0.08);
    --ink:#FF0018;
    --ink-dim:rgba(255,0,24,0.55);
    --ink-faint:rgba(255,0,24,0.30);
    --spark:#FF0018;
    --spark-soft:rgba(255,0,24,0.28);
    --skel:rgba(255,0,24,0.14);
    --skel-hi:rgba(255,0,24,0.24);
    --strike-intensity:0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    background:var(--void);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  /* ================= 01 — STAGE / DARK BACKGROUND ================= */
  .stage{
    width:100%;
    max-width:460px;
    min-height:100vh;
    position:relative;
    background: var(--void);
    overflow:hidden;
    border-radius:38px;
    padding:22px 14px 40px;
  }


  .lightning-gl{
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index:0;
    display:block;
    pointer-events:none;
  }
  .lightning-flash{
    position:absolute; inset:0;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(ellipse 70% 60% at 50% 42%, rgba(255,235,225,0.85), rgba(255,90,70,0.35) 42%, transparent 78%);
    opacity:0;
  }

  /* ================= 02 — LARGE ROUNDED FRAME ================= */
  .frame{
    position:relative;
    z-index:1;
    isolation:isolate;
    border-radius:38px;
    background:rgba(8,8,10,0.55);
    border:1px solid var(--edge-soft);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.65),
      inset 0 0 60px -20px rgba(255,0,24,0.08);
    padding:20px 18px 26px;
    overflow:hidden;
    clip-path:inset(0 round 38px);
    animation:riseIn 0.9s cubic-bezier(.2,.8,.2,1) both;
  }
  .frame::before{ /* inner highlight — top edge only, no corner-mask trick */
    content:"";
    position:absolute;
    top:0; left:8%; right:8%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,0,24,0.22), transparent);
    pointer-events:none;
  }
  .ambient-drift{
    position:absolute;
    inset:-10%;
    background:radial-gradient(480px circle at 30% 20%, rgba(255,0,24,0.05), transparent 60%);
    animation:ambientDrift 42s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes ambientDrift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(3%,4%) scale(1.08); }
  }
  /* signature system — energy from the background lightning "conducts" into the
     foreground frame, tying the whole scene to one light source instead of two
     unrelated effects. Driven by --strike-intensity, set per-frame from the
     lightning module (0 when idle, rising during a strike). */
  .frame-strike-glow{
    position:absolute; inset:0;
    background:radial-gradient(ellipse 80% 55% at 50% 32%, rgba(255,70,50,0.4), transparent 72%);
    opacity:var(--strike-intensity, 0);
    pointer-events:none;
    mix-blend-mode:screen;
    z-index:0;
  }

  /* ================= 07 — DEKMASHSHOP ENERGY TYPOGRAPHY ================= */
  .bg-type-stage{
    position:absolute;
    top:38%;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    padding:0 14px;
    height:min(20vw,110px);
    z-index:1;
    pointer-events:none;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  /* soft red ambient light breathing behind the whole wordmark */
  .bg-type-ambient{
    position:absolute;
    width:66%;
    height:230%;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(255,0,24,0.12), transparent 70%);
    filter:blur(12px) brightness(calc(1 + var(--strike-intensity, 0) * 0.8));
    animation:bgAmbientPulse 7s ease-in-out infinite;
    z-index:0;
  }
  @keyframes bgAmbientPulse{
    0%,100%{ opacity:0.55; }
    50%{ opacity:1; }
  }

  .bg-type{
    position:relative;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:min(13.5vw,62px);
    letter-spacing:-0.01em;
    white-space:nowrap;
    z-index:1;
    pointer-events:none;
    user-select:none;
  }
  .bg-type .layer{
    position:absolute;
    inset:0;
    display:block;
  }
  /* depth shadow — furthest back */
  .bg-type .layer.shadow{
    color:rgba(0,0,0,0.5);
    transform:translate(3px,4px);
    filter:blur(3px);
  }
  /* 2 offset duplicate layers for a subtle extruded/dimensional edge */
  .bg-type .layer.depth{
    color:transparent;
    -webkit-text-stroke:1px rgba(110,0,8,0.16);
  }
  .bg-type .layer.depth.d2{ transform:translate(2.5px,2.5px); }
  .bg-type .layer.depth.d1{ transform:translate(1.2px,1.2px); }
  /* main outline — dark red stroke */
  .bg-type .layer.outline{
    color:transparent;
    -webkit-text-stroke:1.2px rgba(179,0,15,0.55);
  }
  /* inner glow fill — light falloff + slow breathing + rare flicker */
  .bg-type .layer.glow-inner{
    background:linear-gradient(180deg, rgba(255,130,120,0.18) 0%, rgba(255,0,24,0.09) 55%, rgba(255,0,24,0.03) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 6px rgba(255,70,55,0.4), 0 0 18px rgba(255,0,24,0.2);
    filter:blur(0.3px);
    animation:bgTypeBreathe 6.5s ease-in-out infinite, bgTypeFlicker 13s linear infinite;
  }
  /* very light sweep, passes quickly then long pause */
  .bg-type .layer.sweep{
    background:linear-gradient(100deg, transparent 42%, rgba(255,255,255,0.16) 50%, transparent 58%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    background-size:340% 100%;
    background-position:150% 0;
    animation:bgTypeSweep 9s ease-in-out infinite;
    mix-blend-mode:screen;
  }
  @keyframes bgTypeBreathe{
    0%,100%{ filter:blur(0.3px) brightness(1); }
    50%{ filter:blur(0.3px) brightness(1.32); }
  }
  @keyframes bgTypeFlicker{
    0%,91%,100%{ opacity:1; }
    92%{ opacity:0.4; } 92.5%{ opacity:1; }
    93%{ opacity:0.6; } 93.4%{ opacity:1; }
    96%{ opacity:1; } 96.3%{ opacity:0.5; } 96.6%{ opacity:1; }
  }
  @keyframes bgTypeSweep{
    0%,78%{ background-position:150% 0; }
    88%{ background-position:-150% 0; }
    100%{ background-position:-150% 0; }
  }

  /* small electric arcs clinging to a few letters — not full-screen */
  .bg-arcs{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .arc{
    position:absolute;
    top:6%;
    width:0.22em;
    height:0.9em;
    opacity:0;
    filter:drop-shadow(0 0 3px rgba(255,70,55,0.9)) drop-shadow(0 0 9px rgba(255,0,24,0.55));
    transform-origin:top center;
  }
  .arc svg{ width:100%; height:100%; display:block; }
  .arc path{ fill:none; stroke:#FFEDEA; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .arc.a1{ left:2.5%;  animation:arcFlicker 3.1s ease-in-out infinite; animation-delay:0.2s; }
  .arc.a2{ left:29%;   animation:arcFlicker 3.8s ease-in-out infinite; animation-delay:1.1s; }
  .arc.a3{ left:49.5%; animation:arcFlicker 2.7s ease-in-out infinite; animation-delay:0.6s; }
  .arc.a4{ left:68%;   animation:arcFlicker 4.2s ease-in-out infinite; animation-delay:1.8s; }
  .arc.a5{ left:93%;   animation:arcFlicker 3.4s ease-in-out infinite; animation-delay:0.9s; }
  @keyframes arcFlicker{
    0%,100%{ opacity:0; transform:scaleY(0.92); }
    4%{ opacity:0.9; transform:scaleY(1); }
    6%{ opacity:0.25; }
    9%{ opacity:0.8; }
    13%{ opacity:0; }
    58%{ opacity:0; }
    61%{ opacity:0.65; }
    64%{ opacity:0; }
  }

  /* rare full lightning-strike bolt, spawned by JS near a random letter */
  .bg-strike-layer{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .bg-strike{
    position:absolute;
    top:5%;
    left:0;
    width:2px;
    height:var(--h,0.9em);
    background:linear-gradient(180deg, rgba(255,237,234,0.95), rgba(255,0,24,0.55));
    filter:drop-shadow(0 0 4px rgba(255,80,60,0.9)) drop-shadow(0 0 15px rgba(255,0,24,0.6));
    border-radius:2px;
    transform-origin:top center;
    transform:scaleY(0);
    opacity:0;
  }
  .bg-strike.go{ animation:bgStrikeGo 0.6s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes bgStrikeGo{
    0%{ transform:scaleY(0); opacity:0; }
    12%{ transform:scaleY(1); opacity:1; }
    28%{ opacity:0.5; }
    40%{ opacity:1; }
    72%{ opacity:0.55; }
    100%{ transform:scaleY(1); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-type-ambient,
    .bg-type .layer.glow-inner,
    .bg-type .layer.sweep,
    .arc{ animation:none !important; }
  }

  /* ================= content layer ================= */
  .content{ position:relative; z-index:7; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
    animation:fadeUp 0.7s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.05s;
  }
  .icon-btn{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    color:rgba(255,0,24,0.5);
    box-shadow:0 4px 16px -6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,0,24,0.05);
  }
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .view-pill{
    display:flex; align-items:center; gap:6px;
    padding:8px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(14px);
  }
  .view-pill .dot{width:12px;height:12px;border-radius:3px;background:rgba(255,0,24,0.25);}
  .view-pill .bar{width:22px;height:8px;border-radius:3px;background:var(--skel);}

  /* ================= 05 — MAIN VISUAL ================= */
  .visual-wrap{
    display:flex;
    justify-content:center;
    margin-top:14px;
    position:relative;
    animation:materialize 0.9s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.15s;
  }
  .visual-glow{
    position:absolute;
    width:220px;height:220px;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,0,24,0.20), transparent 68%);
    filter:blur(4px);
    animation:breathe 4.5s ease-in-out infinite;
    z-index:0;
  }
  .visual-placeholder{
    position:relative;
    width:150px; height:150px;
    border-radius:50%;
    background:
      radial-gradient(circle at 42% 32%, rgba(255,0,24,0.14), rgba(255,0,24,0.03) 65%),
      url('assets/store-logo.jpg');
    background-size:cover;
    background-position:center;
    border:1px solid var(--edge);
    box-shadow:
      0 0 0 1px rgba(255,0,24,0.02),
      0 20px 40px -18px rgba(0,0,0,0.7),
      inset 0 0 26px rgba(0,0,0,0.5),
      inset 2px 2px 0 rgba(255,90,70,0.09),
      inset -2px -2px 0 rgba(0,0,0,0.35);
    animation:floatMain 6.5s ease-in-out infinite;
    z-index:1;
    overflow:hidden;
  }
  .visual-inner{
    position:relative;
    width:150px;
    height:150px;
    z-index:1;
  }

  /* ================= 08 — MAIN TITLE (static-grain + glow, no flat text) ================= */
  .title-placeholder{
    margin-top:20px;
    position:relative;
    text-align:center;
    font-family:"Rajdhani","Anton","Arial Black","Segoe UI",sans-serif;
    font-weight:700;
    font-size:clamp(26px,7.6vw,34px);
    letter-spacing:0.08em;
    line-height:1;
    color:transparent;
    animation:materialize 0.9s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.4s;
  }
  .title-placeholder .txt{
    position:relative;
    display:inline-block;
    background: linear-gradient(180deg, #ffffff, #ffffff 60%, #ffffff);
    -webkit-background-clip:text;
    background-clip:text;
    filter:drop-shadow(0 0 10px rgba(255,0,24,0.5)) drop-shadow(0 0 26px rgba(255,0,24,0.35));
  }
  .title-placeholder::after{ /* pulsing glow disc behind the wordmark */
    content:"";
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:120%; height:230%;
    background:radial-gradient(ellipse at center, rgba(255,0,24,0.20), transparent 65%);
    filter:blur(6px);
    animation:glowPulse 2.8s ease-in-out infinite;
    z-index:-1;
    pointer-events:none;
  }
  @keyframes staticGrain{
    0%{background-position:0 0, 0 0, 0 0;}
    25%{background-position:2px 1px, -1px 2px, 0 0;}
    50%{background-position:-2px 2px, 1px -1px, 0 0;}
    75%{background-position:1px -2px, -2px -1px, 0 0;}
    100%{background-position:0 0, 0 0, 0 0;}
  }
  @keyframes glowPulse{
    0%,100%{opacity:0.5; transform:translate(-50%,-50%) scale(0.95);}
    50%{opacity:1; transform:translate(-50%,-50%) scale(1.06);}
  }

  /* ================= 09 — BADGE ================= */
  .badge-row{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:8px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.45s;
  }
  .badge-pill{
    display:flex; align-items:center; gap:6px;
    padding:7px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(12px);
    box-shadow:0 0 18px -8px rgba(255,0,24,0.35), inset 0 1px 0 rgba(255,0,24,0.05);
  }
  .badge-pill .ic{width:14px;height:14px;border-radius:4px;background:rgba(255,0,24,0.35);}
  .badge-pill .ic.round{border-radius:50%;}

  /* ================= 10 — INFORMATION CHIPS ================= */
  .chip-row{
    margin-top:18px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.55s;
  }
  .chip{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    box-shadow:none;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .chip .ic{width:13px;height:13px;border-radius:4px;background:rgba(255,0,24,0.3);flex:0 0 auto;}
  .chip .ic svg{width:100%;height:100%;stroke:#FF0018;fill:none;stroke-width:2;}
  .chip .label{font-size:11px;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:0.06em;}
  .chip .value{font-family:'Anton',sans-serif;font-size:13px;font-weight:400;color:#ffffff;letter-spacing:0.03em;}
  .chip .bar{height:9px;border-radius:4px;background:var(--skel);}
  .chip .bar.w1{width:50px;}
  .chip .bar.w2{width:34px;}
  .chip.wide{padding:10px 20px;}
  .chip.wide .bar{width:120px;}
  .chip.wide .value{
    display:inline-block;
    max-width:130px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    vertical-align:bottom;
  }

  .chip-single{
    margin-top:10px;
    display:flex;
    justify-content:center;
  }

  /* description */
  .desc{
    margin-top:16px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.65s;
  }
  .desc .bar{height:9px;border-radius:4px;background:rgba(255,0,24,0.06);}
  .desc .bar:nth-child(1){width:60%;}
  .desc .bar:nth-child(2){width:42%;}

  /* notice text (no frame) */
  .notice{
    margin-top:22px;
    padding:0 6px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.75s;
  }
  .notice .txt{
    font-family:'Noto Looped Lao','Noto Sans Lao','Poppins',-apple-system,sans-serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:0.02em;
    background:linear-gradient(180deg,#ffffff 0%,#ffffff 45%,#ffffff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 8px rgba(255,0,24,0.5), 0 0 20px rgba(255,0,24,0.35);
    animation:noticeGlow 3.6s ease-in-out infinite;
    animation-delay:0.6s;
    display:inline-block;
  }
  @keyframes noticeGlow{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.14); }
  }

  /* ================= 11/12 — SOCIAL CARD ================= */
  .social-card{
    margin-top:18px;
    position:relative;
    isolation:isolate;
    border-radius:22px;
    background:linear-gradient(155deg, #150002 0%, #0F0002 55%, #0A0001 100%);
    border:1px solid rgba(255,0,24,0.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:16px 18px;
    display:flex; align-items:center; gap:16px;
    min-height:96px;
    box-shadow:
      0 20px 40px -20px rgba(0,0,0,0.7),
      inset 1px 1px 0 rgba(255,70,55,0.07),
      inset -1px -1px 0 rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,0,24,0.05);
    overflow:hidden;
    animation:cardIn 0.7s cubic-bezier(.22,1,.36,1) both;
    animation-delay:0.85s;
  }
  .social-card.card-2{ margin-top:14px; animation-delay:0.97s; }
  .social-card.card-3{ margin-top:14px; animation-delay:1.09s; }
  .social-card::before{ /* fallback tint beneath video, in case video hasn't loaded yet */
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background:linear-gradient(115deg, rgba(0,0,0,0.4) 0%, transparent 45%, rgba(255,0,24,0.03) 100%);
    pointer-events:none;
    z-index:0;
  }
  .social-card::after{ /* soft blurred shape, kept inside bounds so it can't leak past the radius */
    content:"";
    position:absolute;
    top:0; right:0; bottom:0; left:0;
    border-radius:inherit;
    background:radial-gradient(circle at 88% -10%, var(--spark-soft), transparent 55%);
    pointer-events:none;
    z-index:0;
  }
  .social-avatar{
    position:relative;
    width:58px; height:58px;
    border-radius:50%;
    background:radial-gradient(circle at 38% 28%, rgba(255,0,24,0.16), rgba(255,0,24,0.03) 75%);
    border:2px solid rgba(0,0,0,0.3);
    flex:0 0 auto;
    box-shadow:
      0 0 30px -8px rgba(255,0,24,0.4),
      inset 1px 1px 0 rgba(255,80,60,0.14),
      inset -1px -1px 0 rgba(0,0,0,0.35);
    z-index:1;
  }
  .social-info{ flex:1; display:flex; flex-direction:column; gap:11px; position:relative; z-index:1; }
  .social-info .bar{height:14px;border-radius:6px;background:var(--skel);}
  .social-info .bar.title{width:68%;height:20px;background:var(--skel-hi);}
  .social-info .bar.sub{width:38%;}
  .social-info .bar.tag{width:52%;}

  .social-card{ text-decoration:none; cursor:pointer; position:relative; will-change:transform; transition:transform 0.45s cubic-bezier(.22,1,.36,1), box-shadow 0.45s cubic-bezier(.22,1,.36,1), border-color 0.35s ease; }
  .social-card:active{ transition-duration:0.12s; transform:scale(0.975) translateY(0); }
  /* controlled imperfection — each card carries its own timing, not a perfect copy */
  .social-card.card-2{ transition-duration:0.42s, 0.42s, 0.32s; }
  .social-card.card-3{ transition-duration:0.49s, 0.49s, 0.38s; }
  @media (hover:hover) and (pointer:fine){
    .social-card:hover{
      transform:translateY(-4px) scale(1.012);
      border-color:rgba(255,0,24,0.32);
      box-shadow:
        0 28px 46px -18px rgba(0,0,0,0.75),

  <script>
    // DEKMASHSHOP background wordmark — occasional small lightning strike (lightweight, CSS-driven)
    (function(){
      var reducedBg = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var layer = document.getElementById('bg-strike-layer');
      if (!layer || reducedBg) return;

      function triggerBgStrike(){
        var xPct = 4 + Math.random() * 92;
        var h = (0.65 + Math.random() * 0.5).toFixed(2) + 'em';
        var bolt = document.createElement('span');
        bolt.className = 'bg-strike';
        bolt.style.left = xPct + '%';
        bolt.style.setProperty('--h', h);
        layer.appendChild(bolt);
        requestAnimationFrame(function(){ bolt.classList.add('go'); });
        setTimeout(function(){ bolt.remove(); }, 700);
      }

      function scheduleBgStrike(){
        var delay = 5000 + Math.random() * 9000; // every 5–14s, sparse
        setTimeout(function(){ triggerBgStrike(); scheduleBgStrike(); }, delay);
      }
      scheduleBgStrike();
    })();

    // Whole card is tappable — clicking anywhere on it opens its link
    (function(){
      document.querySelectorAll('.social-card').forEach(function(card){
        var link = card.querySelector('.card-link');
        if (!link || !link.href) return;
        card.addEventListener('click', function(e){
          if (e.target.closest('.card-link')) return; // let the real <a> handle its own tap
          window.open(link.href, '_blank', 'noopener');
        });
      });
    })();

    // Pointer-tracking spotlight + press ripple/light-pulse (desktop hover only for spotlight)
    (function(){
      var canHover = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
      var pressTargets = document.querySelectorAll('.social-card, .music-toggle');

      if (canHover) {
        document.querySelectorAll('.social-card').forEach(function(card){
          card.addEventListener('pointermove', function(e){
            var r = card.getBoundingClientRect();
            var mx = ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%';
            var my = ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%';
            card.style.setProperty('--mx', mx);
            card.style.setProperty('--my', my);
          });
        });
      }

      pressTargets.forEach(function(el){
        el.addEventListener('pointerdown', function(e){
          var r = el.getBoundingClientRect();
          var size = Math.max(r.width, r.height) * 1.3;
          var ripple = document.createElement('span');
          ripple.className = 'press-ripple';
          ripple.style.width = size + 'px';
          ripple.style.height = size + 'px';
          ripple.style.left = (e.clientX - r.left) + 'px';
          ripple.style.top = (e.clientY - r.top) + 'px';
          el.appendChild(ripple);
          ripple.addEventListener('animationend', function(){ ripple.remove(); });
        });
      });
    })();

    document.querySelectorAll('.card-bg-video').forEach(function(v){
      v.muted = true;
      v.defaultMuted = true;
      var tryPlay = function(){ v.play().catch(function(){}); };
      tryPlay();
      document.addEventListener('touchstart', tryPlay, { once:true, passive:true });
      document.addEventListener('click', tryPlay, { once:true });
    });

    // Background music + floating toggle button
    var bgMusic = document.getElementById('bg-music');
    var toggleBtn = document.getElementById('music-toggle');
    if (bgMusic && toggleBtn) {
      bgMusic.volume = 0.6;
      var userPaused = false;

      var setMutedUI = function(isMuted){
        toggleBtn.classList.toggle('is-muted', isMuted);
      };

      var startMusic = function(){
        if (userPaused) return;
        bgMusic.play().then(function(){ setMutedUI(false); }).catch(function(){});
      };

      // Try immediately in case autoplay is allowed
      startMusic();
      // Fallback: start on first tap/click/scroll anywhere (mobile autoplay policies)
      window.addEventListener('touchstart', startMusic, { once:true, passive:true });
      window.addEventListener('click', startMusic, { once:true });
      window.addEventListener('scroll', startMusic, { once:true, passive:true });

      toggleBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if (bgMusic.paused) {
          userPaused = false;
          bgMusic.play().then(function(){ setMutedUI(false); }).catch(function(){});
        } else {
          userPaused = true;
          bgMusic.pause();
          setMutedUI(true);
        }
      });

      // Reflect actual state if it changes for any other reason
      bgMusic.addEventListener('pause', function(){ setMutedUI(true); });
      bgMusic.addEventListener('play', function(){ setMutedUI(false); });

      // Start muted-looking until we know playback actually began
      setMutedUI(true);
    }
  </script>

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stageEl = document.querySelector('.stage');
    const canvas = document.getElementById('lightning-gl');

    function stageSize(){
      const r = stageEl.getBoundingClientRect();
      return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
    }

    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0A0304, 0.05);

    let { w: sw, h: sh } = stageSize();
    const camera = new THREE.PerspectiveCamera(50, sw/sh, 0.1, 100);
    camera.position.set(0, 0.5, 9);
    camera.lookAt(0, 0.5, 0);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(sw, sh), 1.7, 0.65, 0.12);
    composer.addPass(bloomPass);

    scene.add(new THREE.AmbientLight(0x120608, 0.15));

    function softDot(size, inner, outer){
      const c = document.createElement('canvas'); c.width=c.height=size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
      g.addColorStop(0, inner); g.addColorStop(1, outer);
      ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
      return new THREE.CanvasTexture(c);
    }
    const hazeTex = softDot(256, 'rgba(255,225,215,0.9)', 'rgba(255,60,45,0)');

    function displaceBolt3D(start, end, iterations, displace){
      let pts = [start.clone(), end.clone()];
      for(let it=0; it<iterations; it++){
        const next = [];
        for(let i=0;i<pts.length-1;i++){
          const a=pts[i], b=pts[i+1];
          const mid = a.clone().add(b).multiplyScalar(0.5);
          const dir = b.clone().sub(a).normalize();
          let perp = new THREE.Vector3(1,0,0).cross(dir);
          if(perp.lengthSq()<0.01) perp = new THREE.Vector3(0,1,0).cross(dir);
          perp.normalize();
          const perp2 = dir.clone().cross(perp).normalize();
          const off = (Math.random()*2-1)*displace;
          const off2 = (Math.random()*2-1)*displace*0.55;
          mid.add(perp.multiplyScalar(off)).add(perp2.multiplyScalar(off2));
          next.push(a, mid);
        }
        next.push(pts[pts.length-1]);
        pts = next; displace *= 0.6;
      }
      return pts;
    }

    function tubeFromPoints(pts, radius, radialSeg){
      const curve = new THREE.CatmullRomCurve3(pts);
      return new THREE.TubeGeometry(curve, Math.max(12, pts.length), radius, radialSeg, false);
    }

    function buildLightning(){
      const group = new THREE.Group();
      const meshes = [];

      const top = new THREE.Vector3((Math.random()-0.5)*1.2, 7.5, (Math.random()-0.5)*1.5);
      const bottom = new THREE.Vector3((Math.random()-0.5)*1.5, -6.5, (Math.random()-0.5)*1.5);
      const trunkPts = displaceBolt3D(top, bottom, 6, 1.1);

      const segCount = 3;
      const perSeg = Math.floor(trunkPts.length/segCount);
      const radii = [0.055, 0.04, 0.025];
      const glowRadii = [0.16, 0.12, 0.08];
      for(let s=0; s<segCount; s++){
        const startIdx = Math.max(0, s*perSeg - 1);
        const endIdx = (s===segCount-1)? trunkPts.length-1 : (s+1)*perSeg;
        const slice = trunkPts.slice(startIdx, endIdx+1);
        if(slice.length < 2) continue;
        const glowGeo = tubeFromPoints(slice, glowRadii[s], 6);
        const glowMat = new THREE.MeshBasicMaterial({ color:0xFF3B2C, transparent:true, opacity:0.42, blending:THREE.AdditiveBlending, depthWrite:false });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        group.add(glowMesh); meshes.push({mesh:glowMesh, base:0.42});

        const coreGeo = tubeFromPoints(slice, radii[s], 6);
        const coreMat = new THREE.MeshBasicMaterial({ color:0xFFF2E6, transparent:true, opacity:1, blending:THREE.AdditiveBlending, depthWrite:false });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        group.add(coreMesh); meshes.push({mesh:coreMesh, base:1});
      }

      const trunkCurve = new THREE.CatmullRomCurve3(trunkPts);

      const secondaryCount = 7 + Math.floor(Math.random()*5);
      for(let i=0;i<secondaryCount;i++){
        const t = 0.08 + Math.random()*0.75;
        const bStart = trunkCurve.getPoint(t);
        const dir = trunkCurve.getTangent(t).clone();
        let perp = new THREE.Vector3(1,0,0).cross(dir);
        if(perp.lengthSq()<0.01) perp = new THREE.Vector3(0,1,0).cross(dir);
        perp.normalize();
        const ang = Math.random()*Math.PI*2;
        const spread = perp.clone().applyAxisAngle(dir, ang);
        const len = 1.0+Math.random()*2.2;
        const bEnd = bStart.clone().add(dir.clone().multiplyScalar(len*0.55)).add(spread.multiplyScalar(len*0.85));
        const bPts = displaceBolt3D(bStart, bEnd, 3, 0.5);

        const glowGeo = tubeFromPoints(bPts, 0.05, 5);
        const glowMat = new THREE.MeshBasicMaterial({ color:0xFF5A45, transparent:true, opacity:0.34, blending:THREE.AdditiveBlending, depthWrite:false });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        group.add(glowMesh); meshes.push({mesh:glowMesh, base:0.34});

        const coreGeo = tubeFromPoints(bPts, 0.015, 5);
        const coreMat = new THREE.MeshBasicMaterial({ color:0xFFE8DE, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        group.add(coreMesh); meshes.push({mesh:coreMesh, base:0.85});

        const tertCount = Math.floor(Math.random()*3);
        const bCurve = new THREE.CatmullRomCurve3(bPts);
        for(let j=0;j<tertCount;j++){
          const tt = 0.3+Math.random()*0.5;
          const tStart = bCurve.getPoint(tt);
          const tDir = bCurve.getTangent(tt).clone();
          let tPerp = new THREE.Vector3(0,1,0).cross(tDir);
          if(tPerp.lengthSq()<0.01) tPerp = new THREE.Vector3(1,0,0).cross(tDir);
          tPerp.normalize().applyAxisAngle(tDir, Math.random()*Math.PI*2);
          const tLen = 0.4+Math.random()*0.8;
          const tEnd = tStart.clone().add(tDir.clone().multiplyScalar(tLen*0.4)).add(tPerp.multiplyScalar(tLen*0.9));
          const tPts = displaceBolt3D(tStart, tEnd, 2, 0.22);
          const tGeo = tubeFromPoints(tPts, 0.008, 4);
          const tMat = new THREE.MeshBasicMaterial({ color:0xFFD9CC, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending, depthWrite:false });
          const tMesh = new THREE.Mesh(tGeo, tMat);
          group.add(tMesh); meshes.push({mesh:tMesh, base:0.4});
        }
      }

      return { group, meshes };
    }

    const hazeSprites = [];
    const hazeGroup = new THREE.Group();
    scene.add(hazeGroup);
    for(let i=0;i<7;i++){
      const mat = new THREE.SpriteMaterial({ map:hazeTex, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending });
      const s = new THREE.Sprite(mat);
      const scale = 2.5+Math.random()*3;
      s.scale.set(scale, scale, 1);
      hazeGroup.add(s);
      hazeSprites.push(s);
    }

    const NUM_LIGHTS = 4;
    const lights = [];
    for(let i=0;i<NUM_LIGHTS;i++){
      const l = new THREE.PointLight(0xFF8A6A, 0, 14, 2);
      scene.add(l);
      lights.push(l);
    }

    const ENVELOPE = [
      {t:0,   v:0.0}, {t:8, v:0.12}, {t:18, v:0.08}, {t:30, v:1.0},
      {t:45,  v:0.55}, {t:60, v:0.9}, {t:80, v:0.35}, {t:100, v:0.7},
      {t:130, v:0.3}, {t:180, v:0.16}, {t:260, v:0.08}, {t:400, v:0.02}, {t:550, v:0.0}
    ];
    const STRIKE_DURATION = 550;
    const COOLDOWN = 4000;

    function envelopeAt(t){
      if(t<=0 || t>=STRIKE_DURATION) return 0;
      for(let i=0;i<ENVELOPE.length-1;i++){
        if(t>=ENVELOPE[i].t && t<=ENVELOPE[i+1].t){
          const a=ENVELOPE[i], b=ENVELOPE[i+1];
          const f = (t-a.t)/(b.t-a.t||1);
          return a.v + (b.v-a.v)*f;
        }
      }
      return 0;
    }

    let current = null;
    let cycleStart = performance.now() + 400;

    function triggerStrike(){
      if(current){ scene.remove(current.group); current = null; }
      const built = buildLightning();
      scene.add(built.group);
      current = { ...built, born: performance.now() };

      hazeSprites.forEach((s,i)=>{
        s.position.set((Math.random()-0.5)*2.5, 6 - i*1.7 + (Math.random()-0.5), (Math.random()-0.5)*1.5);
      });
      lights.forEach((l,i)=>{
        l.position.set((Math.random()-0.5)*1.5, 6 - i*4, (Math.random()-0.5)*1.5);
      });
    }

    const flashEl = document.getElementById('lightning-flash');

    const clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now();
      clock.getDelta();

      if(now - cycleStart >= COOLDOWN){
        cycleStart = now;
        triggerStrike();
      }

      let intensity = 0;
      if(current){
        const t = now - current.born;
        intensity = envelopeAt(t);
        if(t > STRIKE_DURATION){
          scene.remove(current.group);
          current = null;
        }
      }

      if(current){
        if(intensity > 0.02 && !reduced){
          current.group.position.set((Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, 0);
        }
        current.meshes.forEach(m=>{
          const flicker = 0.85 + Math.random()*0.3;
          m.mesh.material.opacity = Math.min(1, m.base * intensity * flicker);
        });
      }

      lights.forEach(l=>{ l.intensity = intensity * 9; });
      hazeSprites.forEach(s=>{ s.material.opacity = intensity * 0.35; });
      flashEl.style.opacity = String(Math.min(0.75, intensity * 0.75));
      bloomPass.strength = 1.2 + intensity*1.1;
      document.documentElement.style.setProperty('--strike-intensity', intensity.toFixed(3));

      composer.render();
    }

    function onResize(){
      const { w, h } = stageSize();
      camera.aspect = w/h; camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    onResize();

    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Dark Profile — Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0505;
    --void-2:#120808;
    --center-lift:#1f0f0f;
    --panel:rgba(40,16,16,0.50);
    --panel-strong:rgba(46,18,18,0.62);
    --edge:rgba(255,80,80,0.16);
    --edge-soft:rgba(255,80,80,0.08);
    --ink:#fff3f3;
    --ink-dim:rgba(255,220,220,0.55);
    --ink-faint:rgba(255,200,200,0.30);
    --spark:#ff5c5c;
    --spark-soft:rgba(255,70,70,0.28);
    --skel:rgba(255,90,90,0.14);
    --skel-hi:rgba(255,90,90,0.24);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100vh;
    background:var(--void);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  /* ================= 01 — STAGE / DARK BACKGROUND ================= */
  .stage{
    width:100%;
    max-width:460px;
    min-height:100vh;
    position:relative;
    background:
      radial-gradient(ellipse 70% 45% at 50% 30%, var(--center-lift), transparent 70%),
      linear-gradient(180deg, var(--void-2) 0%, var(--void) 55%, #050506 100%);
    overflow:hidden;
    border-radius:38px;
    padding:22px 14px 40px;
  }

  /* fine grain noise, opacity kept very low */
  .fx-noise{
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    z-index:5;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
  }

  /* cinematic vignette — section 16 */
  .fx-vignette{
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    z-index:6;
    background:
      radial-gradient(ellipse 80% 60% at 50% 38%, transparent 45%, rgba(0,0,0,0.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 12%, transparent 85%, rgba(0,0,0,0.5) 100%);
  }

  /* ================= FX — PREMIUM CYBER LIGHTNING BACKGROUND SYSTEM ================= */
  /* Layer order: 1 black base → 2 red gradient → 3 aurora smoke → 4 energy orbs →
     5 cyber grid → 6 energy waves → 7 particles → 8 lightning →
     9 existing noise → 10 existing vignette */

  /* Layer 2 — Core Glow + Red Gradient wash */
  .fx-core-glow{
    position:absolute; left:50%; top:26%;
    width:140%; padding-bottom:90%;
    transform:translate(-50%,-50%);
    z-index:1; pointer-events:none;
    background:radial-gradient(circle, rgba(255,45,45,0.28) 0%, rgba(255,25,25,0.12) 32%, transparent 68%);
    filter:blur(6px);
    mix-blend-mode:screen;
    animation:coreBreathe 9s ease-in-out infinite;
  }
  @keyframes coreBreathe{ 0%,100%{ opacity:0.7; transform:translate(-50%,-50%) scale(1); } 50%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); } }

  .fx-red-gradient{
    position:absolute; inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 70% 42% at 50% 30%, rgba(255,50,50,0.2), transparent 72%),
      linear-gradient(180deg, rgba(12,4,4,0) 0%, rgba(80,10,10,0.26) 42%, rgba(6,2,2,0) 100%);
    mix-blend-mode:screen;
  }

  /* Layer 3 — Aurora smoke ribbons */
  .fx-aurora{ position:absolute; inset:-25%; z-index:1; pointer-events:none; filter:blur(38px); mix-blend-mode:screen; }
  .fx-aurora i{ position:absolute; border-radius:50%; }
  .fx-aurora i:nth-child(1){
    width:70%; height:55%; left:-15%; top:0%;
    background:conic-gradient(from 90deg, rgba(255,20,20,0.32), rgba(120,0,0,0) 45%, rgba(255,60,60,0.22) 75%, rgba(120,0,0,0));
    animation:auroraSpin1 34s linear infinite;
  }
  .fx-aurora i:nth-child(2){
    width:65%; height:60%; right:-18%; bottom:-8%;
    background:conic-gradient(from 200deg, rgba(200,0,0,0.28), rgba(80,0,0,0) 40%, rgba(255,80,80,0.18) 70%, rgba(80,0,0,0));
    animation:auroraSpin2 42s linear infinite reverse;
  }
  @keyframes auroraSpin1{ 0%{ transform:rotate(0deg) scale(1); opacity:0.55; } 50%{ opacity:0.85; } 100%{ transform:rotate(360deg) scale(1.05); opacity:0.55; } }
  @keyframes auroraSpin2{ 0%{ transform:rotate(0deg) scale(1); opacity:0.45; } 50%{ opacity:0.7; } 100%{ transform:rotate(360deg) scale(1.06); opacity:0.45; } }

  /* Layer 4 — Red Energy Orbs */
  .fx-orbs{ position:absolute; inset:0; z-index:2; pointer-events:none; mix-blend-mode:screen; }
  .fx-orbs i{ position:absolute; border-radius:50%; filter:blur(20px); }
  .fx-orbs i:nth-child(1){ width:150px;height:150px; left:6%; top:14%; background:radial-gradient(circle, rgba(255,80,80,0.55) 0%, rgba(255,40,40,0.22) 45%, transparent 75%); animation:orbFloat1 16s ease-in-out infinite, orbPulse 5s ease-in-out infinite; }
  .fx-orbs i:nth-child(2){ width:110px;height:110px; right:4%; top:28%; background:radial-gradient(circle, rgba(255,110,110,0.45) 0%, rgba(255,50,50,0.18) 45%, transparent 75%); animation:orbFloat2 19s ease-in-out infinite, orbPulse 6.5s ease-in-out infinite; }
  .fx-orbs i:nth-child(3){ width:190px;height:190px; left:-8%; top:54%; background:radial-gradient(circle, rgba(230,20,20,0.4) 0%, rgba(200,10,10,0.15) 45%, transparent 75%); animation:orbFloat3 24s ease-in-out infinite, orbPulse 7.5s ease-in-out infinite; }
  .fx-orbs i:nth-child(4){ width:120px;height:120px; right:-6%; bottom:14%; background:radial-gradient(circle, rgba(255,90,90,0.4) 0%, rgba(255,40,40,0.15) 45%, transparent 75%); animation:orbFloat1 21s ease-in-out infinite reverse, orbPulse 5.8s ease-in-out infinite; }
  @keyframes orbFloat1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(16px,-22px); } }
  @keyframes orbFloat2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-20px,18px); } }
  @keyframes orbFloat3{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(14px,16px); } }
  @keyframes orbPulse{ 0%,100%{ opacity:0.65; } 50%{ opacity:1; } }

  /* Layer 5 — Cyber Grid */
  .fx-grid{
    position:absolute; left:-20%; right:-20%; bottom:-15%; height:58%;
    z-index:2; pointer-events:none; opacity:0.09;
    background-image:
      linear-gradient(rgba(255,80,80,0.8) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,80,80,0.8) 1px, transparent 1px);
    background-size:34px 34px;
    transform:perspective(320px) rotateX(62deg);
    transform-origin:bottom;
    animation:gridPan 10s linear infinite;
    mask-image:linear-gradient(to top, black, transparent 85%);
    -webkit-mask-image:linear-gradient(to top, black, transparent 85%);
  }
  .fx-grid::after{
    content:""; position:absolute; left:0; right:0; top:0; height:2px;
    background:linear-gradient(90deg, transparent, rgba(255,90,90,0.9), transparent);
    filter:blur(1px);
  }
  @keyframes gridPan{ 0%{ background-position:0 0,0 0; } 100%{ background-position:0 34px,34px 0; } }

  /* Layer 7 — Floating Particles (sharp core + soft glow) */
  .fx-particles{ position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
  .fx-particles .glow{ position:absolute; inset:0; filter:blur(4px); opacity:0.8; }
  .fx-particles .layer-a,
  .fx-particles .layer-b{ position:absolute; top:0; left:0; width:3px; height:3px; border-radius:50%; background:transparent; }
  .fx-particles .layer-a{
    background:rgba(255,255,255,0.75);
    box-shadow:
      22px 60px 0 0 rgba(255,255,255,0.6),
      70px 140px 0 0 rgba(255,255,255,0.4),
      130px 40px 0 0 rgba(255,255,255,0.55),
      190px 200px 0 0 rgba(255,255,255,0.35),
      250px 90px 0 0 rgba(255,255,255,0.5),
      310px 260px 0 0 rgba(255,255,255,0.35),
      60px 340px 0 0 rgba(255,255,255,0.4),
      160px 420px 0 0 rgba(255,255,255,0.35),
      280px 480px 0 0 rgba(255,255,255,0.5),
      40px 560px 0 0 rgba(255,255,255,0.35),
      220px 620px 0 0 rgba(255,255,255,0.4),
      350px 700px 0 0 rgba(255,255,255,0.35);
    animation:particleFloatA 20s ease-in-out infinite;
  }
  .fx-particles .layer-b{
    background:rgba(255,80,80,0.85);
    box-shadow:
      100px 100px 0 0 rgba(255,80,80,0.65),
      200px 260px 0 0 rgba(255,80,80,0.5),
      40px 320px 0 0 rgba(255,110,110,0.6),
      300px 180px 0 0 rgba(255,80,80,0.5),
      150px 480px 0 0 rgba(255,110,110,0.55),
      260px 560px 0 0 rgba(255,80,80,0.45),
      70px 640px 0 0 rgba(255,110,110,0.5),
      330px 720px 0 0 rgba(255,80,80,0.45);
    animation:particleFloatB 26s ease-in-out infinite;
  }
  @keyframes particleFloatA{ 0%,100%{ transform:translateY(0); opacity:0.75; } 50%{ transform:translateY(-16px); opacity:1; } }
  @keyframes particleFloatB{ 0%,100%{ transform:translateY(0); opacity:0.6; } 50%{ transform:translateY(-12px); opacity:0.95; } }

  @media (max-width:480px){
    .fx-core-glow{ filter:blur(4px); }
    .fx-aurora{ filter:blur(24px); }
    .fx-orbs i{ filter:blur(13px); }
    .fx-particles .layer-a{
      box-shadow:
        22px 60px 0 0 rgba(255,255,255,0.6),
        130px 40px 0 0 rgba(255,255,255,0.55),
        250px 90px 0 0 rgba(255,255,255,0.5),
        160px 420px 0 0 rgba(255,255,255,0.35),
        40px 560px 0 0 rgba(255,255,255,0.35);
    }
    .fx-particles .layer-b{
      box-shadow:
        100px 100px 0 0 rgba(255,80,80,0.65),
        40px 320px 0 0 rgba(255,110,110,0.6),
        150px 480px 0 0 rgba(255,110,110,0.55);
    }
  }

  /* ================= 02 — LARGE ROUNDED FRAME ================= */
  .frame{
    position:relative;
    isolation:isolate;
    border-radius:38px;
    background:rgba(8,8,10,0.55);
    border:1px solid var(--edge-soft);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.65),
      inset 0 0 60px -20px rgba(255,70,70,0.08);
    padding:20px 18px 26px;
    overflow:hidden;
    clip-path:inset(0 round 38px);
    animation:riseIn 0.9s cubic-bezier(.2,.8,.2,1) both;
  }
  .frame::before{ /* inner highlight — top edge only, no corner-mask trick */
    content:"";
    position:absolute;
    top:0; left:8%; right:8%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,140,140,0.22), transparent);
    pointer-events:none;
  }

  /* ================= 07 — OVERSIZED BACKGROUND TYPOGRAPHY ================= */
  .bg-type{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:min(26vw,150px);
    font-weight:900;
    letter-spacing:0.02em;
    color:rgba(255,140,140,0.05);
    white-space:nowrap;
    filter:blur(0.5px);
    z-index:1;
    pointer-events:none;
    user-select:none;
  }

  /* ================= content layer ================= */
  .content{ position:relative; z-index:7; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
    animation:fadeUp 0.7s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.05s;
  }
  .icon-btn{
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    color:rgba(255,140,140,0.5);
    box-shadow:0 4px 16px -6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,140,140,0.05);
  }
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .view-pill{
    display:flex; align-items:center; gap:6px;
    padding:8px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(14px);
  }
  .view-pill .dot{width:12px;height:12px;border-radius:3px;background:rgba(255,140,140,0.25);}
  .view-pill .bar{width:22px;height:8px;border-radius:3px;background:var(--skel);}

  /* ================= 05 — MAIN VISUAL ================= */
  .visual-wrap{
    display:flex;
    justify-content:center;
    margin-top:14px;
    position:relative;
  }
  .visual-glow{
    position:absolute;
    width:220px;height:220px;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,90,90,0.20), transparent 68%);
    filter:blur(4px);
    animation:breathe 4.5s ease-in-out infinite;
    z-index:0;
  }
  .visual-placeholder{
    position:relative;
    width:150px; height:150px;
    border-radius:50%;
    background:
      radial-gradient(circle at 42% 32%, rgba(255,140,140,0.14), rgba(255,140,140,0.03) 65%),
      url('assets/store-logo.jpg');
    background-size:cover;
    background-position:center;
    border:1px solid var(--edge);
    box-shadow:
      0 0 0 1px rgba(255,140,140,0.02),
      0 20px 40px -18px rgba(0,0,0,0.7),
      inset 0 0 26px rgba(0,0,0,0.5);
    animation:floatMain 6.5s ease-in-out infinite;
    z-index:1;
    overflow:hidden;
  }

  /* ================= 08 — MAIN TITLE (static-grain + glow, no flat text) ================= */
  .title-placeholder{
    margin-top:20px;
    position:relative;
    text-align:center;
    font-family:"Arial Black","Segoe UI",sans-serif;
    font-weight:900;
    font-size:clamp(24px,7.2vw,32px);
    letter-spacing:0.03em;
    line-height:1;
    color:transparent;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.35s;
  }
  .title-placeholder .txt{
    position:relative;
    display:inline-block;
    background:
      repeating-radial-gradient(circle at 22% 30%, #fff 0 1px, transparent 1.6px 3px),
      repeating-radial-gradient(circle at 68% 62%, #fff 0 1px, transparent 1.4px 2.8px),
      linear-gradient(180deg, #fff5f5, #ffd6d6 60%, #ff8f8f);
    -webkit-background-clip:text;
    background-clip:text;
    background-size:6px 6px, 5px 5px, 100% 100%;
    animation:staticGrain 0.5s steps(4) infinite;
    filter:drop-shadow(0 0 10px rgba(255,110,110,0.55)) drop-shadow(0 0 26px rgba(255,70,70,0.35));
  }
  .title-placeholder::after{ /* pulsing glow disc behind the wordmark */
    content:"";
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:120%; height:230%;
    background:radial-gradient(ellipse at center, rgba(255,70,70,0.22), transparent 65%);
    filter:blur(6px);
    animation:glowPulse 2.8s ease-in-out infinite;
    z-index:-1;
    pointer-events:none;
  }
  @keyframes staticGrain{
    0%{background-position:0 0, 0 0, 0 0;}
    25%{background-position:2px 1px, -1px 2px, 0 0;}
    50%{background-position:-2px 2px, 1px -1px, 0 0;}
    75%{background-position:1px -2px, -2px -1px, 0 0;}
    100%{background-position:0 0, 0 0, 0 0;}
  }
  @keyframes glowPulse{
    0%,100%{opacity:0.5; transform:translate(-50%,-50%) scale(0.95);}
    50%{opacity:1; transform:translate(-50%,-50%) scale(1.06);}
  }

  /* ================= 09 — BADGE ================= */
  .badge-row{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:8px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.45s;
  }
  .badge-pill{
    display:flex; align-items:center; gap:6px;
    padding:7px 14px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(12px);
    box-shadow:0 0 18px -8px rgba(255,90,90,0.35), inset 0 1px 0 rgba(255,140,140,0.05);
  }
  .badge-pill .ic{width:14px;height:14px;border-radius:4px;background:rgba(255,140,140,0.35);}
  .badge-pill .ic.round{border-radius:50%;}

  /* ================= 10 — INFORMATION CHIPS ================= */
  .chip-row{
    margin-top:18px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.55s;
  }
  .chip{
    display:flex; align-items:center; gap:8px;
    padding:9px 15px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--edge-soft);
    backdrop-filter:blur(12px);
  }
  .chip .ic{width:13px;height:13px;border-radius:4px;background:rgba(255,140,140,0.3);flex:0 0 auto;}
  .chip .ic svg{width:100%;height:100%;stroke:#ffb3b3;fill:none;stroke-width:2;}
  .chip .label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.06em;}
  .chip .value{font-size:12px;font-weight:600;color:var(--ink);letter-spacing:0.02em;}
  .chip .bar{height:9px;border-radius:4px;background:var(--skel);}
  .chip .bar.w1{width:50px;}
  .chip .bar.w2{width:34px;}
  .chip.wide{padding:10px 20px;}
  .chip.wide .bar{width:120px;}
  .chip.wide .value{
    display:inline-block;
    max-width:130px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    vertical-align:bottom;
  }

  .chip-single{
    margin-top:10px;
    display:flex;
    justify-content:center;
  }

  /* description */
  .desc{
    margin-top:16px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.65s;
  }
  .desc .bar{height:9px;border-radius:4px;background:rgba(255,140,140,0.06);}
  .desc .bar:nth-child(1){width:60%;}
  .desc .bar:nth-child(2){width:42%;}

  /* notice text (no frame) */
  .notice{
    margin-top:22px;
    padding:0 6px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    animation:fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.75s;
  }
  .notice .txt{
    font-family:'Poppins',-apple-system,sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
    color:#ffe9e9;
    text-shadow:0 0 18px rgba(255,80,80,0.45);
  }

  /* ================= 11/12 — SOCIAL CARD ================= */
  .social-card{
    margin-top:18px;
    position:relative;
    isolation:isolate;
    border-radius:30px;
    background:var(--panel);
    border:1px solid var(--edge);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:20px;
    display:flex; align-items:center; gap:20px;
    min-height:120px;
    box-shadow:
      0 20px 40px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,140,140,0.05);
    overflow:hidden;
    animation:fadeUp 0.85s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:0.85s;
  }
  .social-card.card-2{ margin-top:14px; animation-delay:0.95s; }
  .social-card.card-3{ margin-top:14px; animation-delay:1.05s; }
  .social-card::before{ /* section 12 texture: gradient darker on one side */
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background:linear-gradient(115deg, rgba(0,0,0,0.35) 0%, transparent 45%, rgba(255,140,140,0.03) 100%);
    pointer-events:none;
    z-index:0;
  }
  .social-card::after{ /* soft blurred shape, kept inside bounds so it can't leak past the radius */
    content:"";
    position:absolute;
    top:0; right:0; bottom:0; left:0;
    border-radius:inherit;
    background:radial-gradient(circle at 88% -10%, var(--spark-soft), transparent 55%);
    pointer-events:none;
    z-index:0;
  }
  .social-avatar{
    position:relative;
    width:88px; height:88px;
    border-radius:22px;
    background:radial-gradient(circle at 38% 28%, rgba(255,140,140,0.16), rgba(255,140,140,0.03) 75%);
    border:1px solid var(--edge);
    flex:0 0 auto;
    box-shadow:0 0 30px -8px rgba(255,90,90,0.4);
    z-index:1;
  }
  .social-info{ flex:1; display:flex; flex-direction:column; gap:11px; position:relative; z-index:1; }
  .social-info .bar{height:14px;border-radius:6px;background:var(--skel);}
  .social-info .bar.title{width:68%;height:20px;background:var(--skel-hi);}
  .social-info .bar.sub{width:38%;}
  .social-info .bar.tag{width:52%;}

  .social-info .bar.label-text{ background:none; }

  /* ================= keyframes ================= */
  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes floatMain{
    0%{transform:translateY(0) scale(1) rotate(0deg);}
    30%{transform:translateY(-6px) scale(1.015) rotate(0.6deg);}
    55%{transform:translateY(2px) scale(1.005) rotate(-0.4deg);}
    80%{transform:translateY(-3px) scale(1.01) rotate(0.3deg);}
    100%{transform:translateY(0) scale(1) rotate(0deg);}
  }
  @keyframes breathe{

  /* ================= floating music toggle button ================= */
  .music-toggle{
    position:fixed;
    left:18px; top:18px;
    width:46px; height:46px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;

    backdrop-filter:blur(10px);
    box-shadow:0 4px 18px -4px rgba(0,0,0,0.5);
    cursor:pointer;
    z-index:50;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  .music-toggle:active{ transform:scale(0.92); }
  .music-toggle svg{
    width:20px; height:20px;
    stroke:#ffffff;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .music-toggle .icon-off{ display:none; }
  .music-toggle.is-muted .icon-on{ display:none; }
  .music-toggle.is-muted .icon-off{ display:block; }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

  <script>
    document.querySelectorAll('.card-bg-video').forEach(function(v){
      v.muted = true;
      v.defaultMuted = true;
      var tryPlay = function(){ v.play().catch(function(){}); };
      tryPlay();
      document.addEventListener('touchstart', tryPlay, { once:true, passive:true });
      document.addEventListener('click', tryPlay, { once:true });
    });

    // Background music + floating toggle button
    var bgMusic = document.getElementById('bg-music');
    var toggleBtn = document.getElementById('music-toggle');
    if (bgMusic && toggleBtn) {
      bgMusic.volume = 0.6;
      var userPaused = false;

      var setMutedUI = function(isMuted){
        toggleBtn.classList.toggle('is-muted', isMuted);
      };

      var startMusic = function(){
        if (userPaused) return;
        bgMusic.play().then(function(){ setMutedUI(false); }).catch(function(){});
      };

      // Try immediately in case autoplay is allowed
      startMusic();
      // Fallback: start on first tap/click/scroll anywhere (mobile autoplay policies)
      window.addEventListener('touchstart', startMusic, { once:true, passive:true });
      window.addEventListener('click', startMusic, { once:true });
      window.addEventListener('scroll', startMusic, { once:true, passive:true });

      toggleBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if (bgMusic.paused) {
          userPaused = false;
          bgMusic.play().then(function(){ setMutedUI(false); }).catch(function(){});
        } else {
          userPaused = true;
          bgMusic.pause();
          setMutedUI(true);
        }
      });

      // Reflect actual state if it changes for any other reason
      bgMusic.addEventListener('pause', function(){ setMutedUI(true); });
      bgMusic.addEventListener('play', function(){ setMutedUI(false); });

      // Start muted-looking until we know playback actually began
      setMutedUI(true);
    }
  </script>
